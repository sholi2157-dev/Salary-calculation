name: Android 2.0 development (no signing, no publishing)
# Runs only on the 2.0 work branch. Never signs, never publishes, never touches release channels.
on:
  push:
    branches: ['claude/v2-android', 'codex/sharing-android-20261021']
    paths: ['app/**', 'gradle/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'scripts/**', '.github/workflows/android-v2.yml']
  workflow_dispatch:
    inputs:
      shots:
        description: 'Only print screenshots whose name contains one of these comma-separated texts (empty: all)'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: android-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    if: ${{ !contains(github.event.head_commit.message, '[v2-rc]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false
      # Fast iteration: "[compile]" in the commit message only compiles app and tests.
      - name: Compile only
        if: ${{ contains(github.event.head_commit.message, '[compile]') }}
        run: gradle :app:compileDebugKotlin :app:compileDebugUnitTestKotlin --console=plain
      # Logic tests run on Debug and Release; screen tests (Robolectric + screenshots) on Debug only.
      - name: Unit regression, release build and instrumentation APK (unsigned)
        if: ${{ !contains(github.event.head_commit.message, '[compile]') }}
        run: >-
          gradle :app:compileDebugKotlin
          :app:testDebugUnitTest --tests 'com.example.Work*Test' --tests 'com.example.V2*Test'
          --tests 'com.example.KisUiTest' --tests 'com.example.AiShiftExperienceTest' --tests 'com.example.OnboardingExperienceTest'
          :app:testReleaseUnitTest --tests 'com.example.Work*Test' --tests 'com.example.V2*Test'
          :app:assembleRelease :app:assembleReleaseAndroidTest -PdistributionInstrumentation=true
          -Proborazzi.test.record=true --continue --console=plain
      - name: Count actual Android test results
        if: ${{ always() && !contains(github.event.head_commit.message, '[compile]') }}
        run: python3 scripts/summarize-android-tests.py
      - name: Verify release identity and local gates
        if: ${{ !contains(github.event.head_commit.message, '[compile]') }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | tee /tmp/release-identity.txt
          grep -F "package: name='com.aistudio.worktracker.qztvdw.distribution'" /tmp/release-identity.txt
          python3 scripts/check-local-build.py
      - name: Print exported Room schemas
        if: always()
        run: for f in app/schemas/*/*.json; do echo "=== $f"; cat "$f"; echo; done
      - name: List failed tests
        if: failure()
        run: |
          grep -l '<failure\|<error' app/build/test-results/*/TEST-*.xml | xargs -r -I{} sh -c 'echo "== {}"; grep -A 15 "<failure\|<error" {} | head -60; grep -E "^(E|W)/|Exception|Caused by" {} | head -60'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-v2-evidence
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/schemas/
            /tmp/release-identity.txt
            /tmp/kis-*.png
            /tmp/onboarding-*.png
            /tmp/stage-ai-*.png
            release-evidence/unit-tests.json
      # Last, so the end of the log is the pictures (the "shots" input narrows them).
      - name: Print screenshots for review (compressed, base64)
        if: ${{ always() && !contains(github.event.head_commit.message, '[compile]') }}
        env:
          SHOTS: ${{ github.event.inputs.shots }}
        run: |
          pip install -q pillow >/dev/null 2>&1 || true
          python3 - <<'PY'
          import base64, glob, io, os
          from PIL import Image
          only = [x for x in os.environ.get('SHOTS', '').split(',') if x]
          files = [f for f in sorted(glob.glob('/tmp/kis-*.png') + glob.glob('/tmp/onboarding-360-*.png') + glob.glob('/tmp/stage-ai-*-360.png')) if not only or any(o in f for o in only)]
          for f in files:
              im = Image.open(f).convert('RGB')
              im.thumbnail((400, 900))
              buf = io.BytesIO(); im.save(buf, 'JPEG', quality=72)
              data = base64.b64encode(buf.getvalue()).decode()
              print('@@IMG ' + os.path.basename(f))
              for i in range(0, len(data), 3000): print('@@B ' + data[i:i+3000])
              print('@@END')
          PY
