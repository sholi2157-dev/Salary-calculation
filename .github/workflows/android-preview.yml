name: Android preview
on:
  push:
    branches: ['codex/preserve-app-sync']
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'web/**'
      - 'web-tests/**'
      - 'api/**'
      - 'server/**'
      - 'index.html'
      - 'vercel.json'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/android-preview.yml'
concurrency:
  group: android-preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify account sync against Firebase emulators
        run: |
          npm install --no-save --package-lock=false firebase@10.8.0 firebase-tools@13.35.1
          npx firebase emulators:exec --project demo-salary-sync --only auth,firestore --config firebase.test.json "node --test integration-tests/firestore.test.cjs"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - run: gradle :app:testDebugUnitTest --tests 'com.example.Work*Test' :app:assemblePreview --console=plain
      - run: gradle :app:testPreviewUnitTest --tests 'com.example.WorkFirebaseConfigurationTest' --console=plain
      - run: gradle :app:assembleDebug --console=plain
      - name: Summarize Android test results
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-com.example.Work*.xml'):
              suite = ET.parse(path).getroot()
              for key in totals: totals[key] += int(suite.get(key, 0))
          print(totals)
          assert totals['tests'] > 0 and totals['failures'] == 0 and totals['errors'] == 0
          PY
      - name: Record public APK installation metadata
        shell: bash
        run: |
          set -euo pipefail
          sdk_tools="${ANDROID_HOME}/build-tools/36.0.0"
          for variant in debug preview; do
          report="app/build/outputs/apk/${variant}/installation-report.txt"
          apk_files=(app/build/outputs/apk/${variant}/*.apk)
          if [[ ${#apk_files[@]} -ne 1 || ! -f "${apk_files[0]}" ]]; then
            echo "Expected exactly one preview APK" >&2
            exit 1
          fi
          {
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "APK SHA-256:"
            sha256sum "${apk_files[0]}"
            echo "Public signing certificate (no private key):"
            "${sdk_tools}/apksigner" verify --verbose --print-certs "${apk_files[0]}"
            echo "Package, version and minimum Android SDK:"
            "${sdk_tools}/aapt2" dump badging "${apk_files[0]}" | sed -n '/^package:/p; /^sdkVersion:/p; /^targetSdkVersion:/p'
            echo "This report does not verify compatibility with an installed app."
            echo "Do not uninstall or clear app data to resolve an update failure."
          } | tee "${report}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: salary-android-updated
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/installation-report.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: salary-trial-1.4
          path: |
            app/build/outputs/apk/preview/*.apk
            app/build/outputs/apk/preview/installation-report.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: app/build/reports/tests/
