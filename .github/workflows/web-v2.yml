name: Web 2.0 (כיס) checks
# The 2.0 website on its own branch: unit rules on the shared fixtures, the fixtures equal Android's, real browser flows.
# This workflow never deploys, aliases or touches production; codex/web-rc15-live is the published website's branch.
on:
  push:
    branches: ['claude/v2-web', 'codex/web-rc15-live', 'codex/download-and-management-20261020', 'codex/sharing-web-20261021', 'release/2.3-web']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the fixture check compares with the Android branch
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build && npm test
      - name: Shared expected results are byte-identical to the Android branch
        run: git fetch --no-tags origin release/2.3-android && node scripts/check-fixtures.cjs . origin/release/2.3-android
      - name: Published Android 2.2.1 fixture backward-compatibility report (non-blocking)
        continue-on-error: true
        run: git fetch --no-tags origin tag android-v2.2.1-code46 && node scripts/check-fixtures.cjs . refs/tags/android-v2.2.1-code46
      - run: npm install --prefix /tmp/browser-qa --no-audit --no-fund playwright@1.62.1
      - run: /tmp/browser-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser flows, data preservation and layout (360–1440, light and dark)
        env:
          PLAYWRIGHT_MODULE: /tmp/browser-qa/node_modules/playwright
          SCREENSHOT_DIR: browser-evidence
        run: node browser-tests/updates.cjs && node browser-tests/v2.cjs && node browser-tests/download.cjs && node browser-tests/sharing.cjs && node browser-tests/job-team.cjs && node browser-tests/fb08-retro-rate.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-v2-browser-evidence
          path: browser-evidence/
