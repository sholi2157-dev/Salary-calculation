name: Publish and verify Android update channel
# Release tag identifies publication; immutable APK source is recorded separately.
# Verification uses standard runner grep; ripgrep is not preinstalled.
on:
  push:
    branches: ['codex/android-local-distribution']
    paths:
      - '.github/workflows/android-update-channel.yml'
      - 'docs/android-update-release.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-live-update-channel
  cancel-in-progress: false
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-update]') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Verify exact previously tested artifact and prepare update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-android-update.py prepare
      - name: Publish to the existing installed-app channel and verify anonymous bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-android-update.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-update-publication-evidence
          path: update-publication/
  verify-live:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Load existing signing identity for test package only
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "$KEY_BASE64"
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/salary-distribution.p12"
      - name: Compile signed instrumentation only; do not rebuild published APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/salary-distribution.p12
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleReleaseAndroidTest -PdistributionInstrumentation=true --console=plain
      - name: Fetch original RC13 installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37415910804 --repo sholi2157-dev/Salary-calculation --name salary-local-release-candidate --dir previous
          echo '74da79a77d99e1e6d98ddca0c4b5b9b6079032cd191e57353ac2344d4c385da1  previous/candidate-b.apk' | sha256sum --check
      - name: Enable disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual online check, download, Android installer and preserved data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/verify-live-update.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-live-update-evidence
          path: live-update-evidence/
      - name: Remove runner signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/salary-distribution.p12"
