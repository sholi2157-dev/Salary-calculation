name: Web Android parity
on:
  push:
    branches: ['codex/web-android-rc13-parity', 'codex/web-rc15-live']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    if: ${{ !contains(github.event.head_commit.message, '[verify-live-web]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Update QA loads the exact completed RC13 shell from Git history.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build && npm test
      - run: npm install --prefix /tmp/browser-qa --no-audit --no-fund playwright@1.62.1
      - run: /tmp/browser-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser flows and data preservation
        env:
          PLAYWRIGHT_MODULE: /tmp/browser-qa/node_modules/playwright
          SCREENSHOT_DIR: browser-evidence
        run: |
          node browser-tests/mobile.cjs
          node browser-tests/parity.cjs
          node browser-tests/updates.cjs
          node browser-tests/rc15.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-parity-browser-evidence
          path: browser-evidence/
