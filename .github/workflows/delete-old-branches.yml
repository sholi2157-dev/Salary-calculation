name: Delete old branches (owner approved 2026-11-09)
# Deletes exactly the branches listed in docs/branches-to-delete-2026-11-09.txt (backup of every branch and its commit:
# /mnt/project-files/release-2.3/branches-backup-2026-11-09.txt). Runs once, on a push whose message asks for it.
on:
  push:
    branches: ['claude/project-thread-4wsd3v']
    paths: ['docs/branches-to-delete-2026-11-09.txt', '.github/workflows/delete-old-branches.yml']
permissions:
  contents: write
jobs:
  delete:
    if: contains(github.event.head_commit.message, '[delete-branches]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep='^(main|codex/android-local-distribution|codex/download-and-management-20261020|release/2.3-android|release/2.3-web|claude/project-thread-4wsd3v|claude/project-thread-a05pcx|claude/light-mode-web|audit/2.3-unified-plan)$'
          ok=0; fail=0
          while read -r b; do
            [ -z "$b" ] && continue
            if echo "$b" | grep -Eq "$keep"; then echo "skip kept: $b"; continue; fi
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$b" >/dev/null 2>&1; then ok=$((ok+1)); else fail=$((fail+1)); echo "failed: $b"; fi
          done < docs/branches-to-delete-2026-11-09.txt
          echo "deleted=$ok failed=$fail"
