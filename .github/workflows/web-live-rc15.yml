name: Verify published website
on:
  push:
    branches: ['codex/web-rc15-live']
    paths: ['docs/rc15-web-live.json']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public deployment is the selected tested source
        run: |
          mkdir -p browser-evidence
          curl --fail --location 'https://salary-calculation-eta.vercel.app/build-info.json' -o browser-evidence/live-build.json
          node -e "const fs=require('fs'),a=JSON.parse(fs.readFileSync('docs/rc15-web-live.json')),b=JSON.parse(fs.readFileSync('browser-evidence/live-build.json'));require('assert').equal(a.sourceSha,b.commit)"
      - run: npm install --prefix /tmp/browser-qa --no-audit --no-fund playwright@1.62.1
      - run: /tmp/browser-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Test actual public UI with isolated synthetic local storage
        env:
          PLAYWRIGHT_MODULE: /tmp/browser-qa/node_modules/playwright
          SCREENSHOT_DIR: browser-evidence
          PUBLIC_SITE_URL: https://salary-calculation-eta.vercel.app/
        run: |
          node browser-tests/rc15.cjs
          node browser-tests/audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-live-browser-evidence
          path: browser-evidence/
