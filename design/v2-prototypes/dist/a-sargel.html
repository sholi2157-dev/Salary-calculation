<title>חישוב שכר · סרגל</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one calm column on a cool paper ground; time is drawn as a ruler everywhere. Rail navigation on wide screens. */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --sunk:#E9EDEC; --ink:#131A21; --muted:#5A6570; --line:#D9DFE1;
  --accent:#1D47D1; --accent-soft:#E5EBFF; --on-accent:#FFFFFF;
  --warn:#9A5800; --warn-soft:#FFF0D6; --ok:#1C7550;
  --font-body:"IBM Plex Sans Hebrew",system-ui,"Segoe UI",Arial,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1015; --surface:#141A21; --sunk:#1B232C; --ink:#E6EBEF; --muted:#94A1AE; --line:#26313B;
  --accent:#8FA8FF; --accent-soft:#1A2547; --on-accent:#0C1015; --warn:#F2B862; --warn-soft:#33250E; --ok:#5FD39C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1015; --surface:#141A21; --sunk:#1B232C; --ink:#E6EBEF; --muted:#94A1AE; --line:#26313B;
  --accent:#8FA8FF; --accent-soft:#1A2547; --on-accent:#0C1015; --warn:#F2B862; --warn-soft:#33250E; --ok:#5FD39C; color-scheme:dark}
/* Shared prototype chrome: toast + test panel. Uses each direction's tokens. */
#core-toast{position:fixed;inset-inline:0;margin-inline:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100% - 32px);display:flex;gap:16px;align-items:center;padding:12px 16px;border-radius:var(--toast-radius,12px);background:var(--ink);color:var(--bg);font:500 14px/1.4 var(--font-body);box-shadow:0 8px 30px rgb(0 0 0/.25);transform:translateY(16px);opacity:0;pointer-events:none;transition:transform .25s,opacity .25s;z-index:80}
#core-toast.show{transform:none;opacity:1;pointer-events:auto}
#core-toast button{background:none;border:0;color:inherit;font:700 14px var(--font-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
[hidden]{display:none!important}
#proto-fab{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom,0px));left:max(8px,env(safe-area-inset-left,0px));z-index:90;font:600 11px var(--font-body);letter-spacing:.02em;padding:6px 10px;border-radius:99px;border:1px dashed var(--muted);background:var(--bg);color:var(--muted);cursor:pointer;opacity:.85}
#proto-panel{position:fixed;bottom:calc(122px + env(safe-area-inset-bottom,0px));max-height:calc(100% - 140px);overflow:auto;left:max(8px,env(safe-area-inset-left,0px));z-index:91;width:min(320px,calc(100% - 16px));padding:14px;border-radius:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 18px 50px rgb(0 0 0/.25);font:14px/1.4 var(--font-body);display:grid;gap:8px}
#proto-panel .pp-head{display:flex;justify-content:space-between;align-items:center}
#proto-panel .pp-head button{background:none;border:0;color:var(--muted);font-size:16px;cursor:pointer}
#proto-panel .pp-note{margin:0;color:var(--muted);font-size:12px}
#proto-panel .pp-l{font-size:12px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}
#proto-panel .pp-clock{font-variant-numeric:tabular-nums;color:var(--ink)}
#proto-panel .pp-seg,#proto-panel .pp-actions{display:flex;gap:6px;flex-wrap:wrap}
#proto-panel .pp-seg button,#proto-panel .pp-actions button{flex:1;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 13px var(--font-body);cursor:pointer}
#proto-panel [aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body:has(.sheet.on) #proto-fab,body:has(.add-page) #proto-fab,body:has(.over) #proto-fab{display:none}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em;unicode-bidi:isolate;direction:ltr;display:inline-block}
.app{max-width:560px;margin-inline:auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand svg{width:30px;height:30px}
.month-nav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px}
.month-nav button{border:0;background:none;width:32px;height:32px;border-radius:99px;cursor:pointer;color:var(--muted)}
.month-nav span{font-weight:600;font-size:14px;padding-inline:6px;min-width:96px;text-align:center}
h2.sec{font-size:13px;font-weight:600;color:var(--muted);margin:24px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
h2.sec button{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
/* Month block */
.month{padding:18px}
.month .big{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline}
.month .big .num{font-size:34px;font-weight:600;line-height:1.1}
.month .big .num small{font-size:20px;color:var(--muted);font-weight:500;margin-inline-end:2px}
.month .meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;border:0;cursor:pointer;text-decoration:none}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.soft{background:var(--accent-soft);color:var(--accent)}
.pill.plain{background:var(--sunk);color:var(--muted)}
/* Ruler */
.ruler{position:relative;height:56px;margin:14px 0 4px}
.ruler .base{position:absolute;inset-inline:0;top:22px;height:12px;border-radius:6px;background:var(--sunk)}
.ruler .tick{position:absolute;top:38px;font:500 10px var(--font-num);color:var(--muted);transform:translateX(50%)}
.ruler .tick::before{content:"";position:absolute;top:-6px;inset-inline-start:50%;width:1px;height:4px;background:var(--line)}
.seg{position:absolute;top:22px;height:12px;border-radius:6px;background:var(--accent)}
.seg.planned{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,transparent 3px 6px);outline:1px solid var(--accent);outline-offset:-1px;opacity:.75}
.seg.pending{background:var(--warn)}
.needle{position:absolute;top:14px;bottom:14px;width:2px;background:var(--ink);border-radius:1px}
.needle::after{content:"עכשיו";position:absolute;top:-16px;transform:translateX(50%);font-size:10px;font-weight:600;white-space:nowrap}
.today{padding:16px 18px 12px}
.today-head{display:flex;justify-content:space-between;align-items:baseline}
.today-head strong{font-size:15px}
.today-head span{color:var(--muted);font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn{white-space:nowrap;min-height:48px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding-inline:14px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:#C2362B}
.btn:active{transform:translateY(1px)}
.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;margin-top:10px;border-radius:var(--r);background:var(--ink);color:var(--bg)}
.timer .num{font-size:26px}
.timer button{background:var(--bg);color:var(--ink);border:0;border-radius:99px;min-height:40px;padding-inline:16px;font-weight:600;cursor:pointer}
/* Rows */
.list{display:grid}
.day-h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;padding:14px 4px 6px;position:sticky;top:0;background:var(--bg);z-index:2}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:6px;cursor:pointer;user-select:none;-webkit-user-select:none;position:relative}
.row .t{font-weight:600;display:flex;gap:8px;align-items:center;min-width:0}
.row .t .num{font-weight:500}
.row .c{color:var(--muted);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{text-align:start;font-weight:600}
.row .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--sunk);position:relative;margin-top:8px}
.row .bar i{position:absolute;top:0;height:4px;border-radius:2px;background:var(--accent)}
.row.planned{background:transparent;border-style:dashed}
.row.planned .bar i{background:repeating-linear-gradient(135deg,var(--accent) 0 2px,transparent 2px 4px)}
.row.sel{outline:2px solid var(--accent);outline-offset:-1px;background:var(--accent-soft)}
.badge{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.paid{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.unpaid{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);display:inline-block}
.inline-actions{grid-column:1/-1;display:flex;gap:8px;margin-top:10px}
.inline-actions button{flex:1;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.inline-actions button.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg-ctl{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.seg-ctl button{flex:1;border:0;background:none;min-height:38px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.seg-ctl button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.08)}
.insight{display:flex;gap:10px;align-items:baseline;padding:10px 4px;border-bottom:1px solid var(--line);font-size:14px}
.insight:last-child{border-bottom:0}
.insight b{font-family:var(--font-num);color:var(--accent);font-size:12px;min-width:22px}
.empty{color:var(--muted);text-align:center;padding:24px;font-size:14px}
/* Nav */
nav.bar{position:fixed;inset:auto 0 0 0;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:40}
nav.bar .in{max-width:560px;margin-inline:auto;display:flex;justify-content:space-around;align-items:center}
nav.bar button{flex:1;border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);min-height:52px;cursor:pointer;padding:4px}
nav.bar button svg{width:22px;height:22px}
nav.bar button[aria-current=page]{color:var(--ink)}
nav.bar button[aria-current=page] svg{color:var(--accent)}
nav.bar .add{flex:0 0 auto;width:56px;height:56px;min-height:0;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-inline:6px;box-shadow:0 6px 18px color-mix(in oklab,var(--accent) 35%,transparent)}
nav.bar .add svg{width:26px;height:26px;color:var(--on-accent)}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgb(10 14 20/.38);z-index:50;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;inset:auto 0 0 0;z-index:51;max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet.on{transform:none}
.sheet .in{max-width:560px;margin-inline:auto;display:grid;gap:14px}
.sheet .in>*,.app>*,.home-grid>*{min-width:0}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 2px}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet-h h3{margin:0;font-size:18px}
.x{border:0;background:var(--sunk);width:36px;height:36px;border-radius:99px;cursor:pointer;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;min-height:36px;padding-inline:14px;font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sug{border-style:dashed;color:var(--accent);border-color:var(--accent)}
.times{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.tbox{border:1.5px solid var(--line);border-radius:var(--r);padding:8px 12px;cursor:pointer;background:var(--surface);text-align:start;display:grid;gap:0}
.tbox[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tbox small{color:var(--muted);font-size:12px;font-weight:600}
.tbox .num{font-size:28px;font-weight:600;justify-self:start}
.tbox.empty .num{color:var(--muted)}
.tbox .next{color:var(--accent);font-size:11px;font-weight:700}
.dur{display:grid;place-items:center;font-size:12px;color:var(--muted);text-align:center;min-width:56px}
.dur .num{font-size:15px;color:var(--ink)}
.adjust{display:flex;gap:6px;align-items:center}
.adjust button{flex:0 0 50px;min-width:0;min-height:40px;border-radius:9px;border:1px solid var(--line);background:var(--sunk);font:600 14px var(--font-num);cursor:pointer}
.adjust input{flex:1;min-width:0;min-height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding-inline:10px;font-family:var(--font-num)}
.scrub{position:relative;height:64px;touch-action:none;margin-top:2px}
.scrub .base{position:absolute;inset-inline:0;top:24px;height:16px;border-radius:8px;background:var(--sunk)}
.scrub .seg{top:24px;height:16px;border-radius:8px;opacity:.9}
.scrub .h{position:absolute;top:14px;width:28px;height:36px;margin-inline-start:-14px;border-radius:10px;background:var(--surface);border:2px solid var(--accent);box-shadow:0 2px 8px rgb(0 0 0/.15);cursor:grab;display:grid;place-items:center;font:600 9px var(--font-num);color:var(--accent)}
.scrub .tick{position:absolute;top:46px;font:500 10px var(--font-num);color:var(--muted);transform:translateX(50%)}
.payline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r);background:var(--sunk)}
.payline label{font-size:13px;color:var(--muted);font-weight:600}
.payline input[type=number]{width:84px;min-height:40px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding-inline:10px;font-family:var(--font-num);font-size:16px}
.payline .tot{margin-inline-start:auto;font-size:20px;font-weight:600}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.switch{appearance:none;width:42px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:inset-inline-start .2s;box-shadow:0 1px 2px rgb(0 0 0/.2)}
.switch:checked{background:var(--accent)}
.switch:checked::after{inset-inline-start:19px}
details.more{border-top:1px solid var(--line);padding-top:4px}
details.more summary{list-style:none;cursor:pointer;font-weight:600;color:var(--accent);padding:8px 2px;display:flex;justify-content:space-between}
details.more summary::-webkit-details-marker{display:none}
.field{display:grid;gap:4px}
.field>label{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.field input,.field select{width:100%;min-width:0}
.msg{font-size:13px;padding:8px 12px;border-radius:9px}
.msg.err{background:#FDE7E5;color:#A0281F}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
:root[data-theme="dark"] .msg.err{background:#3A1714;color:#FFB4AB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .msg.err{background:#3A1714;color:#FFB4AB}}
.worker{display:grid;grid-template-columns:auto 1fr 96px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.worker input[type=number]{min-height:36px;border:1px solid var(--line);border-radius:8px;padding-inline:8px;background:var(--surface);font-family:var(--font-num)}
.days{display:flex;gap:6px}
.days button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.days button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.save{position:sticky;bottom:0;padding-top:8px;background:linear-gradient(transparent,var(--surface) 30%)}
.save .btn{width:100%;min-height:54px;font-size:16px}
/* Select bar */
.selbar{position:fixed;inset:auto 0 0 0;z-index:45;background:var(--ink);color:var(--bg);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.selbar .in{max-width:560px;margin-inline:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.selbar strong{margin-inline-end:auto}
.selbar button{min-height:40px;border-radius:9px;border:1px solid color-mix(in oklab,var(--bg) 30%,transparent);background:none;color:var(--bg);font-weight:600;padding-inline:12px;cursor:pointer}
/* Settings */
.set-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:visible}
.set{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);min-height:56px;position:relative}
.set:last-child{border-bottom:0}
.set .lbl{flex:1;min-width:0}
.set .lbl small{display:block;color:var(--muted);font-size:13px}
.set select{min-height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding-inline:8px}
.info{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:600 12px var(--font-num);color:var(--muted);cursor:pointer;display:inline-grid;place-items:center;vertical-align:middle;margin-inline-start:4px}
.pop{position:absolute;z-index:30;inset-inline:12px;top:calc(100% - 6px);background:var(--ink);color:var(--bg);border-radius:12px;padding:14px 16px;font-size:14px;box-shadow:0 12px 30px rgb(0 0 0/.25);display:grid;gap:6px}
.pop h4{margin:0;font-size:14px}
.pop p{margin:0;opacity:.88}
.pop ol{margin:0;padding-inline-start:18px;opacity:.88}
.pop a{color:inherit;font-weight:600}
.pop::before{content:"";position:absolute;top:-6px;inset-inline-end:24px;width:12px;height:12px;background:var(--ink);transform:rotate(45deg)}
/* Chart */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px;padding:12px 4px 0}
.wk div{display:grid;gap:4px;justify-items:center;height:100%;align-content:end}
.wk i{display:block;width:100%;max-width:28px;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:3px}
.wk span{font-size:11px;color:var(--muted)}
.wk div.top i{background:var(--ink)}
/* Wrapped + brand overlays */
.over{position:fixed;inset:0;z-index:70;background:var(--ink);color:var(--bg);display:grid;grid-template-rows:auto 1fr auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:3px;border-radius:2px;background:color-mix(in oklab,var(--bg) 25%,transparent)}

<script>
/* Salary Calculation 2.0 prototypes: shared behaviour engine.
   Synthetic data only. Every direction renders its own UI on top of this. */
const Core = (() => {
  'use strict';
  const DAY = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
  const DAY_SHORT = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
  const MONTH = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];

  /* ---------- dates & times ---------- */
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
  const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const fromMin = m => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
  const weekday = s => parseYmd(s).getDay();
  const ym = s => s.slice(0, 7);

  let clockOffset = 0; // minutes; the prototype panel can move time forward
  const now = () => new Date(Date.now() + clockOffset * 60000);
  const today = () => ymd(now());
  const nowMin = () => { const n = now(); return n.getHours() * 60 + n.getMinutes(); };
  const roundedEnd = () => fromMin(Math.floor(nowMin() / 30) * 30);

  function dayLabel(s) {
    const t = today();
    if (s === t) return 'היום';
    if (s === addDays(t, -1)) return 'אתמול';
    if (s === addDays(t, 1)) return 'מחר';
    const d = parseYmd(s);
    return `יום ${DAY_SHORT[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}`;
  }
  const shortDate = s => { const d = parseYmd(s); return `${d.getDate()}.${d.getMonth() + 1}`; };
  const monthName = k => { const [y, m] = k.split('-').map(Number); return `${MONTH[m - 1]} ${y}`; };
  const prevMonth = k => { const [y, m] = k.split('-').map(Number); const d = new Date(y, m - 2, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
  const nextMonth = k => { const [y, m] = k.split('-').map(Number); const d = new Date(y, m, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };

  /* Shift span. End earlier than start means the shift crosses midnight. */
  function span(start, end, breakMin = 0) {
    if (!start || !end) return null;
    const s = toMin(start); let e = toMin(end);
    if (e === s) return { minutes: 0, overnight: false, invalid: true, reason: 'שעת ההתחלה והסיום זהות' };
    const overnight = e < s;
    if (overnight) e += 1440;
    const minutes = e - s - (Number(breakMin) || 0);
    if (minutes <= 0) return { minutes: 0, overnight, invalid: true, reason: 'ההפסקה ארוכה מהמשמרת' };
    return { minutes, overnight, invalid: false, long: minutes > 16 * 60 };
  }
  const endDateTime = (date, start, end) => {
    const d = parseYmd(date); const s = toMin(start); let e = toMin(end); if (e <= s) e += 1440;
    d.setMinutes(e); return d;
  };
  const startDateTime = (date, start) => { const d = parseYmd(date); d.setMinutes(toMin(start)); return d; };

  /* ---------- formatting ---------- */
  const nf = new Intl.NumberFormat('he-IL', { maximumFractionDigits: 2 });
  const nf0 = new Intl.NumberFormat('he-IL', { maximumFractionDigits: 0 });
  const money = (v, cur, whole) => cur + (whole ? nf0 : nf).format(v);
  const hours = mins => { const h = mins / 60; return (Math.round(h * 100) / 100).toLocaleString('he-IL', { maximumFractionDigits: 2 }); };
  const hm = mins => `${Math.floor(mins / 60)}:${pad(mins % 60)}`;
  const round2 = v => Math.round((v + Number.EPSILON) * 100) / 100;
  const pl = (n, one, many) => n === 1 ? one : many.replace('#', n);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- state ---------- */
  let KEY = 'salary-v2-proto';
  let state;
  const listeners = new Set();
  const uid = () => Math.random().toString(36).slice(2, 10);

  const CATS = [
    { id: 'c1', name: 'מסעדת הנמל', rate: 52, currency: '₪', hue: 0 },
    { id: 'c2', name: 'שיעורים פרטיים', rate: 120, currency: '₪', hue: 1 },
    { id: 'c3', name: 'פרילנס — עיצוב', rate: 35, currency: '$', hue: 2 },
    { id: 'c4', name: 'גן אירועים אלמוג', rate: null, currency: '₪', hue: 3 },
  ];
  const WORKERS = ['נועה', 'איתי', 'מאיה', 'עומר'];

  function seed() {
    const t = today();
    const shifts = [];
    const add = (offset, cat, start, end, extra = {}) => {
      const date = addDays(t, offset);
      const c = CATS.find(x => x.id === cat);
      const rate = 'rate' in extra ? extra.rate : c.rate;
      const sp = span(start, end, extra.breakMin || 0);
      const bonus = extra.bonus || 0;
      shifts.push({
        id: uid(), cat, date, start, end, breakMin: extra.breakMin || 0, rate, currency: c.currency, bonus,
        total: rate == null ? null : round2(sp.minutes / 60 * rate + bonus),
        paid: offset < -13, notes: extra.notes || '', group: extra.group || null, auto: false, ruleKey: null,
      });
    };
    // Six weeks of a realistic mixed pattern.
    for (let off = -44; off <= -1; off++) {
      const wd = weekday(addDays(t, off));
      if (wd === 0 || wd === 2) add(off, 'c1', '17:00', off % 3 === 0 ? '23:00' : '22:30');
      if (wd === 4 && off < -7) add(off, 'c1', '17:00', '22:30');
      if (wd === 1 || wd === 3) add(off, 'c2', '16:00', '18:00');
      if (wd === 5 && off % 2 === 0) add(off, 'c3', '09:00', '13:30', { breakMin: 30 });
    }
    // Details that show the new behaviour.
    add(-9, 'c1', '20:00', '02:00', { bonus: 50, notes: 'סגירה של אירוע פרטי' });
    add(-6, 'c4', '18:00', '01:00', { rate: null, notes: 'חתונה — התעריף עוד לא סוכם' });
    add(-2, 'c4', '19:00', '00:30', { rate: null });
    add(-12, 'c4', '17:30', '23:30', {
      rate: 45, bonus: 40,
      group: { workers: [{ name: 'נועה', bonus: 40 }, { name: 'איתי', bonus: 40 }, { name: 'מאיה', bonus: 0 }] },
      notes: 'הפקה עם צוות',
    });
    const rules = [{
      id: 'r1', cat: 'c1', days: [0, 2, 4], start: '17:00', end: '22:30', rate: 52, currency: '₪',
      from: t, until: addDays(t, 55),
    }, {
      id: 'r2', cat: 'c2', days: [1, 3], start: '16:00', end: '18:00', rate: 120, currency: '₪',
      from: addDays(t, 1), until: addDays(t, 40),
    }];
    return {
      v: 1, cats: CATS.map(c => ({ ...c })), workers: [...WORKERS], shifts, rules, exceptions: {},
      settings: {
        autoConfirm: true, notifyMonthly: true, notifyRate: true, rateFrequency: 'weekly',
        planningView: 'unified', defaultCat: 'c1', aiKey: false, theme: 'system',
      },
      lastAuto: [], clockOffset: 0,
    };
  }

  function load(direction) {
    KEY = 'salary-v2-proto-' + direction;
    try { state = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch { state = null; }
    if (!state || state.v !== 1) state = seed();
    clockOffset = state.clockOffset || 0;
    return state;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { /* storage may be blocked */ } }
  function commit() { save(); listeners.forEach(fn => fn(state)); }
  const subscribe = fn => listeners.add(fn);
  function reset() { state = seed(); clockOffset = 0; commit(); }
  function advance(minutes) { clockOffset += minutes; state.clockOffset = clockOffset; const done = catchUp(); commit(); return done; }

  const cat = id => state.cats.find(c => c.id === id) || state.cats[0];

  /* ---------- planned shifts ---------- */
  const occKey = (ruleId, date) => `${ruleId}@${date}`;
  function occurrences() {
    const out = [];
    const confirmed = new Set(state.shifts.filter(s => s.ruleKey).map(s => s.ruleKey));
    for (const r of state.rules) {
      for (let d = r.from; d <= r.until; d = addDays(d, 1)) {
        if (!r.days.includes(weekday(d))) continue;
        const key = occKey(r.id, d);
        if (confirmed.has(key)) continue;
        const ex = state.exceptions[key] || {};
        if (ex.cancelled) continue;
        const o = { key, ruleId: r.id, cat: r.cat, date: d, start: ex.start || r.start, end: ex.end || r.end,
          rate: 'rate' in ex ? ex.rate : r.rate, currency: r.currency, bonus: ex.bonus || 0, edited: !!ex.start || 'rate' in ex };
        o.status = endDateTime(o.date, o.start, o.end) <= now() ? 'awaiting' : 'planned';
        out.push(o);
      }
    }
    return out.sort((a, b) => startDateTime(a.date, a.start) - startDateTime(b.date, b.start));
  }
  function shiftFromOcc(o, auto) {
    const sp = span(o.start, o.end);
    return { id: uid(), cat: o.cat, date: o.date, start: o.start, end: o.end, breakMin: 0, rate: o.rate, currency: o.currency,
      bonus: o.bonus || 0, total: o.rate == null ? null : round2(sp.minutes / 60 * o.rate + (o.bonus || 0)),
      paid: false, notes: '', group: null, auto, ruleKey: o.key };
  }
  /* Safe catch-up: idempotent because each occurrence key can be confirmed once. */
  function catchUp() {
    if (!state.settings.autoConfirm) return [];
    const done = [];
    for (const o of occurrences()) if (o.status === 'awaiting' && !state.exceptions[o.key]?.hold) { const s = shiftFromOcc(o, true); state.shifts.push(s); done.push(s.id); }
    if (done.length) state.lastAuto = done;
    return done;
  }
  function undoAuto(ids) {
    // Undo turns them back into planned/awaiting occurrences; nothing else changes.
    for (const s of state.shifts) if (ids.includes(s.id) && s.ruleKey) state.exceptions[s.ruleKey] = { ...(state.exceptions[s.ruleKey] || {}), hold: true };
    state.shifts = state.shifts.filter(s => !ids.includes(s.id));
    commit();
  }
  function confirmOcc(key) { const o = occurrences().find(x => x.key === key); if (o) { state.shifts.push(shiftFromOcc(o, false)); commit(); } }
  function cancelOcc(key) { state.exceptions[key] = { ...(state.exceptions[key] || {}), cancelled: true }; commit(); }
  function restoreOcc(key) { const ex = state.exceptions[key]; if (ex) delete ex.cancelled; commit(); }
  function editOcc(key, patch, scope) {
    const [ruleId, date] = key.split('@');
    const r = state.rules.find(x => x.id === ruleId);
    if (scope === 'one') { state.exceptions[key] = { ...(state.exceptions[key] || {}), ...patch }; }
    else {
      // This and following: end the old series the day before, start a new one.
      const nr = { ...r, id: 'r' + uid(), from: date, ...patch };
      r.until = addDays(date, -1);
      state.rules.push(nr);
    }
    commit();
  }
  function futureCount(ruleId) { return occurrences().filter(o => o.ruleId === ruleId && o.status === 'planned').length; }
  function applyRateToFuture(ruleId, rate) {
    const r = state.rules.find(x => x.id === ruleId); r.rate = rate;
    for (const o of occurrences()) if (o.ruleId === ruleId && o.status === 'planned' && state.exceptions[o.key]) delete state.exceptions[o.key].rate;
    commit();
  }
  function previewRule(rule) {
    const dates = [];
    for (let d = rule.from; d <= rule.until; d = addDays(d, 1)) if (rule.days.includes(weekday(d))) dates.push(d);
    const occ = occurrences();
    const clashes = dates.filter(d => occ.some(o => o.date === d && overlaps(o, rule)) || state.shifts.some(s => s.date === d && overlaps(s, rule)));
    return { dates, clashes };
  }
  function overlaps(a, b) {
    const as = toMin(a.start), bs = toMin(b.start);
    let ae = toMin(a.end), be = toMin(b.end); if (ae <= as) ae += 1440; if (be <= bs) be += 1440;
    return as < be && bs < ae;
  }

  /* ---------- drafts (add / edit shift) ---------- */
  function suggestStart(catId, date) {
    const same = state.shifts.filter(s => s.cat === catId && weekday(s.date) === weekday(date));
    const mode = list => { const m = {}; list.forEach(s => m[s.start] = (m[s.start] || 0) + 1); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
    const strong = mode(same);
    const chips = mode(state.shifts.filter(s => s.cat === catId)).slice(0, 3).map(x => x[0]);
    const fallback = chips.length ? chips : mode(state.shifts).slice(0, 3).map(x => x[0]);
    return { start: strong.length && strong[0][1] >= 3 ? strong[0][0] : null, chips: fallback };
  }
  function newDraft(over = {}) {
    const c = cat(state.settings.defaultCat);
    const d = { id: null, cat: c.id, date: today(), start: null, end: roundedEnd(), breakMin: 0, rate: c.rate, rateUnknown: c.rate == null,
      currency: c.currency, bonus: 0, bonusTarget: 'me', notes: '', group: null, repeat: null, ...over };
    if (!over.start) d.start = suggestStart(d.cat, d.date).start;
    return d;
  }
  function draftFromShift(s) {
    return { id: s.id, cat: s.cat, date: s.date, start: s.start, end: s.end, breakMin: s.breakMin, rate: s.rate, rateUnknown: s.rate == null,
      currency: s.currency, bonus: s.bonus, bonusTarget: 'me', notes: s.notes, group: s.group ? JSON.parse(JSON.stringify(s.group)) : null, repeat: null, auto: s.auto };
  }
  function setDraftCat(d, id) {
    const c = cat(id); d.cat = id; d.currency = c.currency;
    if (!d.id) { d.rate = c.rate; d.rateUnknown = c.rate == null; const s = suggestStart(id, d.date); if (s.start) d.start = s.start; }
  }
  function evaluate(d) {
    const errors = [], warnings = [];
    if (!d.start) errors.push('בחר שעת התחלה');
    const sp = d.start ? span(d.start, d.end, d.breakMin) : null;
    if (sp && sp.invalid) errors.push(sp.reason);
    if (sp && sp.long) warnings.push('משמרת של יותר מ-16 שעות. לוודא?');
    if (sp && sp.overnight && toMin(d.end) > toMin(d.start) - 60 && sp.minutes > 20 * 60) warnings.push('נראה כמו טעות בשעות');
    const rate = d.rateUnknown ? null : Number(d.rate);
    if (!d.rateUnknown && !(rate >= 0)) errors.push('הזן תעריף, או סמן "תעריף חסר"');
    const myBonus = d.group ? (d.bonusTarget === 'others' ? 0 : Number(d.bonus) || 0) : Number(d.bonus) || 0;
    const base = sp && !sp.invalid && rate != null ? sp.minutes / 60 * rate : null;
    return { errors, warnings, span: sp, base, bonus: myBonus, total: base == null ? null : round2(base + myBonus) };
  }
  function saveDraft(d) {
    const ev = evaluate(d);
    if (ev.errors.length) return { ok: false, errors: ev.errors };
    if (d.repeat) {
      const r = { id: 'r' + uid(), cat: d.cat, days: d.repeat.days, start: d.start, end: d.end, rate: d.rateUnknown ? null : Number(d.rate),
        currency: d.currency, from: d.date, until: d.repeat.until };
      state.rules.push(r); const done = catchUp(); commit();
      return { ok: true, rule: r, auto: done };
    }
    const rec = { cat: d.cat, date: d.date, start: d.start, end: d.end, breakMin: Number(d.breakMin) || 0, rate: d.rateUnknown ? null : Number(d.rate),
      currency: d.currency, bonus: ev.bonus, total: ev.total, notes: d.notes, group: d.group };
    if (d.id) { const s = state.shifts.find(x => x.id === d.id); Object.assign(s, rec, { auto: false }); }
    else state.shifts.push({ id: uid(), paid: false, auto: false, ruleKey: null, ...rec });
    commit(); return { ok: true };
  }
  function deleteShift(id) { const i = state.shifts.findIndex(s => s.id === id); const [s] = state.shifts.splice(i, 1); commit(); return s; }
  function restoreShift(s) { state.shifts.push(s); commit(); }

  /* Bulk rate completion: writes only to shifts whose rate is missing. */
  function bulkRatePreview(ids, rate) {
    const list = state.shifts.filter(s => ids.includes(s.id));
    const target = list.filter(s => s.rate == null);
    return { target: target.map(s => ({ ...s, newTotal: round2(span(s.start, s.end, s.breakMin).minutes / 60 * rate + (s.bonus || 0)) })), skipped: list.length - target.length };
  }
  function bulkRateApply(ids, rate) {
    const done = [];
    for (const s of state.shifts) if (ids.includes(s.id) && s.rate == null) {
      s.rate = rate; s.total = round2(span(s.start, s.end, s.breakMin).minutes / 60 * rate + (s.bonus || 0)); done.push(s.id);
    }
    commit(); return done;
  }
  function setPaid(ids, paid) { state.shifts.forEach(s => { if (ids.includes(s.id)) s.paid = paid; }); commit(); }

  /* ---------- summaries ---------- */
  const shiftMinutes = s => span(s.start, s.end, s.breakMin).minutes;
  function monthStats(k) {
    const list = state.shifts.filter(s => ym(s.date) === k);
    const byCur = {};
    let minutes = 0, pending = 0;
    for (const s of list) {
      const m = shiftMinutes(s); minutes += m;
      if (s.total == null) { pending++; continue; }
      const c = byCur[s.currency] ||= { total: 0, paid: 0, unpaid: 0, minutes: 0 };
      c.total += s.total; c.minutes += m; s.paid ? c.paid += s.total : c.unpaid += s.total;
    }
    // Compare like with like: for the running month, only the same days of last month.
    const cutoff = k === ym(today()) ? Number(today().slice(8)) : 31;
    const prev = state.shifts.filter(s => ym(s.date) === prevMonth(k) && Number(s.date.slice(8)) <= cutoff).reduce((a, s) => a + shiftMinutes(s), 0);
    const days = Array(7).fill(0); list.forEach(s => days[weekday(s.date)] += shiftMinutes(s));
    const cats = {}; list.forEach(s => cats[s.cat] = (cats[s.cat] || 0) + shiftMinutes(s));
    const planned = occurrences().filter(o => ym(o.date) === k && o.status === 'planned');
    const plannedMin = planned.reduce((a, o) => a + span(o.start, o.end).minutes, 0);
    return { k, list, count: list.length, minutes, byCur, pending, prevMinutes: prev, days, cats, planned: planned.length, plannedMin };
  }
  function insights(st) {
    const out = [];
    const unpaid = Object.entries(st.byCur).filter(([, c]) => c.unpaid > 0);

function live() {
  const d = draft, ev = C.evaluate(d);

  $('#dur').innerHTML = sp && !sp.invalid ? `<span class="num">${C.hm(sp.minutes)}</span>שעות` : '';

    segs.innerHTML = b > a ? `<i class="seg" style="inset-inline-start:${pct(a)}%;width:${pct(b - a)}%"></i>` : `<i class="seg" style="inset-inline-start:${pct(a)}%;width:${100 - pct(a)}%"></i><i class="seg" style="inset-inline-start:0;width:${pct(b)}%"></i>`;
    $('#hs').style.insetInlineStart = pct(a) + '%';

function bindScrub() {
  const el = $('#scrub'); if (!el) return;
  let which = null;
  const toTime = e => {
    const r = el.getBoundingClientRect();
    const frac = (r.right - e.clientX) / r.width; // RTL: time runs right to left
    return C.fromMin(Math.max(0, Math.min(1439, Math.round(frac * 1440 / 15) * 15)));
  };
  el.addEventListener('pointerdown', e => {
    which = e.target.dataset.h || (draft.start ? (Math.abs(e.clientX - $('#hs').getBoundingClientRect().x) < Math.abs(e.clientX - $('#he').getBoundingClientRect().x) ? 'start' : 'end') : 'start');
    el.setPointerCapture(e.pointerId); focus = which; draft[which] = toTime(e);
    if (which === 'start' && !$('#hs')) { sheet(); return; }
    document.querySelectorAll('.tbox').forEach(b => b.setAttribute('aria-pressed', b.dataset.focus === focus)); live();
  });
  el.addEventListener('pointermove', e => { if (!which) return; draft[which] = toTime(e); live(); });
  el.addEventListener('pointerup', () => { which = null; });
}

function wrappedView() {

  const slides = [
    () => `<div class="eyebrow">${E(C.monthName(month))}</div><div class="huge">${C.hours(st.minutes)}</div><h3>שעות עבודה ב-${st.count} משמרות</h3><div class="ruler-big"><i style="inset-inline-start:0;width:${Math.min(100, st.minutes / (180 * 60) * 100)}%"></i></div><p>הסרגל מלא ב-180 שעות</p>`,
    () => w.topCat ? `<div class="eyebrow">המקום שלך</div><h3>${E(w.topCat.name)}</h3><div class="huge">${C.hours(w.topCat.minutes)}</div><p>שעות, ${Math.round(w.topCat.minutes / Math.max(1, st.minutes) * 100)}% מהחודש</p>` : '<h3>חודש שקט</h3>',
    () => w.longest ? `<div class="eyebrow">המשמרת הארוכה</div><div class="huge">${C.hm(C.shiftMinutes(w.longest))}</div><h3>${E(C.dayLabel(w.longest.date))}, <span class="num">${w.longest.start}–${w.longest.end}</span></h3><p>${w.nights} משמרות הסתיימו אחרי 23:00</p>` : '',
    () => `<div class="eyebrow">יום ${E(w.bestDay)}</div><h3>היום שבו עבדת הכי הרבה</h3><div class="wk" style="height:160px">${st.days.map((m, i) => `<div><i style="height:${m / Math.max(...st.days, 1) * 86}%;background:${C.DAY[i] === w.bestDay ? 'var(--accent)' : 'color-mix(in oklab,var(--bg) 35%,transparent)'}"></i><span style="color:inherit;opacity:.7">${C.DAY_SHORT[i]}</span></div>`).join('')}</div>`,
    () => `<div class="eyebrow">ההכנסה של החודש</div>${cur.map(([c, v]) => `<div class="huge" style="font-size:clamp(44px,13vw,80px)" data-amt>${hide ? '•••••' : E(C.money(v.total, c, true))}</div>`).join('')}${st.pending ? `<p>ועוד ${st.pending} משמרות שממתינות לתעריף</p>` : ''}<p style="font-size:13px">הסכומים מוסתרים בשיתוף</p><button class="pill soft" data-reveal style="justify-self:start;min-height:36px">${hide ? 'הצגת הסכום' : 'הסתרה'}</button>`,
  ].filter(f => f());
  let i = 0;
  const el = document.createElement('div'); el.className = 'over'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'סיכום החודש');
  const draw = () => {
    el.innerHTML = `<div class="prog">${slides.map((_, j) => `<i class="${j <= i ? 'on' : ''}"></i>`).join('')}</div><div class="slide">${slides[i]()}</div>
      <div class="ctrl"><button data-w="close">סגירה</button><span style="display:flex;gap:8px">${i ? '<button data-w="prev">הקודם</button>' : ''}<button class="go" data-w="${i < slides.length - 1 ? 'next' : 'share'}">${i < slides.length - 1 ? 'הבא' : 'שיתוף'}</button></span></div>`;
  };

    if (a !== 'close') draw();
  };
  draw(); document.body.append(el);
}

  el.innerHTML = `<div class="in">
    <div style="display:flex;justify-content:space-between"><span class="pill plain">כיוון א׳ · סרגל</span><button class="x" data-close aria-label="סגירה">✕</button></div>
    <div class="bp-hero">${LOGO}<div><h1>חישוב שכר</h1><p>כלי מדויק ושקט. כל משמרת היא קטע על סרגל הזמן.</p></div></div>
    <div class="panel" style="padding:18px;display:grid;gap:10px"><strong>הרעיון</strong><p style="margin:0;color:var(--muted)">הסמל הוא קטע זמן מודגש על סרגל של יום. הוא חוזר בכל מקום במוצר: בשורת היום, ברשימה, בטופס ובסיכום. הצבע הוא כחול קובלט של דיו, והמספרים מוצגים בגופן מונו כדי ששעות וסכומים יתיישרו כמו בדוח.</p></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:start">
      <div class="phone-home">${['', '', '', ''].map(() => '<div><span class="ic"></span><span>&nbsp;</span></div>').join('')}<div><span style="width:56px;height:56px">${LOGO.replace('rx="17"', 'rx="15"')}</span><span>חישוב שכר</span></div>${['', '', ''].map(() => '<div><span class="ic"></span><span>&nbsp;</span></div>').join('')}</div>
      <div class="spec"><small style="color:var(--muted)">IBM Plex Sans Hebrew</small><span class="d">משמרת ערב</span><small style="color:var(--muted)">IBM Plex Mono · מספרים</small><span class="n">17:00–22:30</span><span class="n" style="font-size:24px">₪4,286.50</span></div>
    </div>
    <div class="swatches">${[['דיו', 'var(--ink)', 'var(--bg)'], ['קובלט', 'var(--accent)', 'var(--on-accent)'], ['נייר', 'var(--bg)', 'var(--ink)'], ['משטח', 'var(--surface)', 'var(--ink)'], ['ממתין', 'var(--warn-soft)', 'var(--warn)'], ['שולם', 'var(--ok)', 'var(--surface)']].map(([n, b, f]) => `<div style="background:${b};color:${f}">${n}</div>`).join('')}</div>
  </div>`;
  el.onclick = e => { if (e.target.closest('[data-close]')) el.remove(); };
  document.body.append(el);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-occ],[data-id],.scrim'); if (!t) { if (pop) { pop = null; render(); } return; }
  const ds = t.dataset;
  if (ds.pop) { pop = pop === ds.pop ? null : ds.pop; render(); return; }
  if (pop && !t.closest('.pop')) { pop = null; }
  if (ds.go) { view = ds.go; if (ds.filter) filter = ds.filter; sel.clear(); openOcc = null; render(); scrollTo(0, 0); return; }
  if (ds.filter && !ds.go) { filter = ds.filter; render(); return; }
  if (draft) {
    if (ds.cat) { C.setDraftCat(draft, ds.cat); sheet(); return; }
    if (ds.date) { draft.date = ds.date; const s = C.suggestStart(draft.cat, draft.date); if (!draft.id && s.start && !draft._touched) draft.start = s.start; sheet(); return; }
    if (ds.focus) { focus = ds.focus; sheet(); return; }
    if (ds.start) { draft.start = ds.start; draft._touched = true; focus = 'end'; sheet(); return; }
    if (ds.nudge) { const k = focus; const base = draft[k] || draft.end; draft[k] = C.fromMin(C.toMin(base) + Number(ds.nudge)); draft._touched = true; if (k === 'start' && !$('#hs')) { sheet(); return; } live(); return; }
    if (ds.day) { const n = Number(ds.day), a = draft.repeat.days; draft.repeat.days = a.includes(n) ? a.filter(x => x !== n) : [...a, n].sort(); sheet(); return; }
    if (ds.addw) { draft.group.workers.push({ name: ds.addw, bonus: 0 }); sheet(); return; }
    if (ds.bonusto) {
      const v = Number($('#ball').value) || 0; draft.bonusTarget = ds.bonusto;
      draft.group.workers.forEach(w => { w.bonus = ds.bonusto === 'me' ? 0 : v; w.on = ds.bonusto !== 'me'; });
      draft.bonus = ds.bonusto === 'others' ? 0 : v; sheet(); return;
    }
  }
  if (ds.occ) { openOcc = openOcc === ds.occ ? null : ds.occ; render(); return; }
  if (ds.id && !ds.act) {
    if (sel.size) { sel.has(ds.id) ? sel.delete(ds.id) : sel.add(ds.id); render(); return; }
    openSheet(C.draftFromShift(S().shifts.find(s => s.id === ds.id))); return;
  }
  const act = ds.act; if (!act) return;
  const A = {
    add: () => openSheet(C.newDraft(ds.repeat ? { repeat: { days: [C.weekday(C.today())], until: C.addDays(C.today(), 56) } } : {})),
    close: () => { closeSheet(); render(); },
    save: () => {
      const r = C.saveDraft(draft);
      if (!r.ok) return;
      closeSheet();
      C.toast(r.rule ? `נוצרה סדרה של ${C.previewRule(r.rule).dates.length} משמרות` : draft?.id ? 'המשמרת עודכנה' : 'המשמרת נשמרה');
    },
    del: () => { const s = C.deleteShift(draft.id); closeSheet(); C.toast('המשמרת נמחקה', 'ביטול', () => C.restoreShift(s)); },
    startTimer: () => { timer = { start: C.fromMin(C.nowMin()), at: Date.now() }; render(); },
    stopTimer: () => { const st = timer.start; timer = null; render(); openSheet(C.newDraft({ start: st, end: C.fromMin(C.nowMin()) })); },
    pending: () => { view = 'log'; filter = 'done'; render(); sel = new Set(S().shifts.filter(s => s.rate == null).map(s => s.id)); render(); },
    prevM: () => { month = C.prevMonth(month); render(); }, nextM: () => { month = C.nextMonth(month); render(); },
    confirmOcc: () => { C.confirmOcc(openOcc); openOcc = null; C.toast('המשמרת נרשמה כבוצעה'); },
    cancelOcc: () => { const k = openOcc; C.cancelOcc(k); openOcc = null; C.toast('המשמרת בוטלה', 'ביטול', () => C.restoreOcc(k)); },
    editOcc: () => occEdit(openOcc),
    bulkRate: () => bulkDialog(),
    bulkApply: () => { const r = Number($('#bk').dataset.rate); const done = C.bulkRateApply([...sel], r); sel.clear(); closeSheet(); C.toast(C.pl(done.length, 'התעריף הושלם במשמרת אחת', 'התעריף הושלם ב-# משמרות')); },
    paid: () => { C.setPaid([...sel], true); C.toast(C.pl(sel.size, 'המשמרת סומנה כשולמה', '# משמרות סומנו כשולמו')); sel.clear(); render(); },
    clearSel: () => { sel.clear(); render(); },
    wrapped: () => wrappedView(),
    ruleRate: () => ruleRateDialog(ds.rule),
    aiKey: () => { S().settings.aiKey = !S().settings.aiKey; C.commit(); },
    noop: () => C.toast('לא פעיל באב-טיפוס'),
  };
  A[act]?.();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (draft) {
    if (t.id === 'dt' || t.id === 'from') { if (t.value) { draft.date = t.value; sheet(); } return; }
    if (t.id === 'until') { draft.repeat.until = t.value; sheet(); return; }
    if (t.id === 'unk') { draft.rateUnknown = t.checked; if (!t.checked && draft.rate == null) draft.rate = ''; sheet(); return; }
    if (t.id === 'grp') { draft.group = t.checked ? { workers: [] } : null; sheet(); return; }
    if (t.id === 'rep') { draft.repeat = t.checked ? { days: [C.weekday(draft.date)], until: C.addDays(draft.date, 56) } : null; sheet(); return; }
    if (t.id === 'cur') { draft.currency = t.value; sheet(); return; }
    if (t.dataset.wb) { draft.group.workers[t.dataset.wb].on = t.checked; return; }
  }
  if (t.id === 'auto') { S().settings.autoConfirm = t.checked; C.commit(); if (t.checked) { const d = C.catchUp(); C.commit(); if (d.length) C.toast(C.pl(d.length, 'משמרת אחת נרשמה כבוצעה', '# משמרות נרשמו כבוצעו'), 'ביטול', () => C.undoAuto(d)); } }
  if (t.id === 'nm') { S().settings.notifyMonthly = t.checked; C.commit(); }
  if (t.id === 'nr') { S().settings.notifyRate = t.checked; C.commit(); }
  if (t.id === 'rf') { S().settings.rateFrequency = t.value; C.commit(); }
  if (t.id === 'defcat') { S().settings.defaultCat = t.value; C.commit(); C.toast('נשמר'); }
});
document.addEventListener('input', e => {
  const t = e.target; if (!draft) return;
  if (t.id === 'tin' && t.value) { draft[focus] = t.value; draft._touched = true; if (focus === 'start' && !$('#hs')) { sheet(); $('#tin').focus(); return; } live(); }
  if (t.id === 'rate') { draft.rate = t.value; live(); }
  if (t.id === 'brk') { draft.breakMin = t.value; live(); }
  if (t.id === 'bon') { draft.bonus = t.value; live(); }
  if (t.id === 'nt') draft.notes = t.value;
  if (t.dataset.wv) draft.group.workers[t.dataset.wv].bonus = Number(t.value) || 0;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (draft || $('.sheet')) { closeSheet(); render(); } document.querySelector('.over,.brand-page')?.remove(); } });

function occEdit(key) {
  const o = C.occurrences().find(x => x.key === key);
  $('#layer').innerHTML = `<div class="scrim on" data-act="close"></div><div class="sheet on" role="dialog" aria-modal="true" aria-label="עריכת משמרת מתוכננת"><div class="in">
    <div class="grab"></div><div class="sheet-h"><h3>משמרת מתוכננת · ${E(C.dayLabel(o.date))}</h3><button class="x" data-act="close" aria-label="סגירה">✕</button></div>
    <div class="grid2"><div class="field"><label for="os">התחלה</label><input type="time" id="os" value="${o.start}"></div><div class="field"><label for="oe">סיום</label><input type="time" id="oe" value="${o.end}"></div></div>
    <div class="seg-ctl" role="group" aria-label="היקף השינוי"><button id="sc1" aria-pressed="true">רק המשמרת הזו</button><button id="sc2" aria-pressed="false">זו והבאות</button></div>
    <button class="btn primary" id="osave">שמירה</button></div></div>`;
  let scope = 'one';
  $('#sc1').onclick = () => { scope = 'one'; $('#sc1').setAttribute('aria-pressed', 'true'); $('#sc2').setAttribute('aria-pressed', 'false'); };
  $('#sc2').onclick = () => { scope = 'all'; $('#sc2').setAttribute('aria-pressed', 'true'); $('#sc1').setAttribute('aria-pressed', 'false'); };
  $('#osave').onclick = () => { C.editOcc(key, { start: $('#os').value, end: $('#oe').value }, scope); $('#layer').innerHTML = ''; openOcc = null; C.toast(scope === 'one' ? 'המשמרת עודכנה' : 'המשמרת והבאות אחריה עודכנו'); };
}
function ruleRateDialog(id) {
  const r = S().rules.find(x => x.id === id), n = C.futureCount(id);
  $('#layer').innerHTML = `<div class="scrim on" data-act="close"></div><div class="sheet on" role="dialog" aria-modal="true" aria-label="תעריף לסדרה"><div class="in">
    <div class="grab"></div><div class="sheet-h"><h3>תעריף לסדרה</h3><button class="x" data-act="close" aria-label="סגירה">✕</button></div>
    <p style="margin:0;color:var(--muted)">${E(C.cat(r.cat).name)} · ${n} משמרות עתידיות. משמרות שכבר בוצעו לא משתנות.</p>
    <div class="payline"><label for="rr">תעריף חדש</label><span class="num">${E(r.currency)}</span><input type="number" id="rr" value="${r.rate ?? ''}" inputmode="decimal"></div>
    <button class="btn primary" id="rsave">החלה על ${n} המשמרות הבאות</button></div></div>`;
  $('#rsave').onclick = () => { C.applyRateToFuture(id, Number($('#rr').value)); $('#layer').innerHTML = ''; C.toast('התעריף עודכן למשמרות העתידיות'); };
}

C.longPress(document.body, '.row[data-id]', el => { sel.add(el.dataset.id); render(); });
setInterval(() => { const el = $('#tick'); if (el && timer) { const s = Math.floor((Date.now() - timer.at) / 1000); el.textContent = [s / 3600, s / 60 % 60, s % 60].map(v => String(Math.floor(v)).padStart(2, '0')).join(':'); } }, 1000);
C.subscribe(() => { if (!draft) render(); });
C.mountPanel({ name: 'כיוון א׳ · סרגל', onBrand: brandView, onWrapped: () => { month = C.ym(C.today()); wrappedView(); } });
render();
const auto = C.catchUp(); if (auto.length) { C.commit(); C.toast(C.pl(auto.length, 'משמרת מתוכננת הסתיימה ונרשמה', '# משמרות מתוכננות הסתיימו ונרשמו'), 'ביטול', () => C.undoAuto(auto)); }
})();
</script>
