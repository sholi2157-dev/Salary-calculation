<title>חישוב שכר · כיס</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: wallet of coloured workplace passes; ink pill navigation; a full-screen keypad for entry. Colour belongs to workplaces, actions are ink. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --sunk:#E2E6EE; --ink:#0D1015; --muted:#5D6573; --line:#D6DBE4;
  --accent:#0D1015; --on-accent:#FFFFFF;
  --k0:#5145E8; --k1:#0E8059; --k2:#D6336C; --k3:#F5B82E; --k4:#7D3CF0; --k5:#1F72E0; --k6:#0E8A86; --k7:#B5294E;
  --k0-ink:#FFFFFF; --k1-ink:#FFFFFF; --k2-ink:#FFFFFF; --k3-ink:#1A1200; --k4-ink:#FFFFFF; --k5-ink:#FFFFFF; --k6-ink:#FFFFFF; --k7-ink:#FFFFFF;
  --k0-bg:linear-gradient(90deg,#5145E8 0%,#1E1873 100%); --k1-bg:linear-gradient(90deg,#0E8059 0%,#073D2C 100%); --k2-bg:linear-gradient(90deg,#D6336C 0%,#5C1230 100%); --k3-bg:linear-gradient(90deg,#F5B82E 0%,#C98A10 100%); --k4-bg:linear-gradient(90deg,#7D3CF0 0%,#2E1466 100%); --k5-bg:linear-gradient(90deg,#1F72E0 0%,#0C2F66 100%); --k6-bg:linear-gradient(90deg,#0E8A86 0%,#063B3A 100%); --k7-bg:linear-gradient(90deg,#B5294E 0%,#4A0F21 100%);
  --k0-on:#FFFFFF; --k1-on:#FFFFFF; --k2-on:#FFFFFF; --k3-on:#1A1200; --k4-on:#FFFFFF; --k5-on:#FFFFFF; --k6-on:#FFFFFF; --k7-on:#FFFFFF;
  --edit:#0D1015; --edit-ink:#FFFFFF; --nav:#0D1015; --nav-ink:rgb(237 240 245/.7); --nav-on:#EDF0F5; --nav-on-ink:#0D1015;
  --warn:#B25E00; --warn-soft:#FFEBC7;
  --font-body:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --font-display:"Secular One","Rubik",system-ui,sans-serif;
  --toast-radius:99px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121212; --surface:#1E1E1E; --sunk:#2A2A2A; --ink:#FFFFFF; --muted:#B3B3B3; --line:#303030; --accent:#FFFFFF; --on-accent:#121212;
  --k0:#8F87FF; --k1:#3DDC97; --k2:#FF6B9A; --k3:#FFC94D; --k4:#B48CFF; --k5:#5AA9FF; --k6:#3CD3CB; --k7:#FF6F8E;
  --k0-ink:#120F3A; --k1-ink:#03140E; --k2-ink:#2E0A18; --k3-ink:#2A1C00; --k4-ink:#1E0B3D; --k5-ink:#06203F; --k6-ink:#04201F; --k7-ink:#2E0812;
  --k0-bg:linear-gradient(90deg,#5145E8 0%,#1E1873 100%); --k1-bg:linear-gradient(90deg,#0E8059 0%,#073D2C 100%); --k2-bg:linear-gradient(90deg,#D6336C 0%,#5C1230 100%); --k3-bg:linear-gradient(90deg,#F5B82E 0%,#C98A10 100%); --k4-bg:linear-gradient(90deg,#7D3CF0 0%,#2E1466 100%); --k5-bg:linear-gradient(90deg,#1F72E0 0%,#0C2F66 100%); --k6-bg:linear-gradient(90deg,#0E8A86 0%,#063B3A 100%); --k7-bg:linear-gradient(90deg,#B5294E 0%,#4A0F21 100%);
  --k0-on:#FFFFFF; --k1-on:#FFFFFF; --k2-on:#FFFFFF; --k3-on:#1A1200; --k4-on:#FFFFFF; --k5-on:#FFFFFF; --k6-on:#FFFFFF; --k7-on:#FFFFFF;
  --edit:#2A2A2A; --edit-ink:#FFFFFF; --nav:#181818; --nav-ink:#B3B3B3; --nav-on:#FFFFFF; --nav-on-ink:#121212;
  --warn:#FFC266; --warn-soft:#3A2D12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1E1E1E; --sunk:#2A2A2A; --ink:#FFFFFF; --muted:#B3B3B3; --line:#303030; --accent:#FFFFFF; --on-accent:#121212;
  --k0:#8F87FF; --k1:#3DDC97; --k2:#FF6B9A; --k3:#FFC94D; --k4:#B48CFF; --k5:#5AA9FF; --k6:#3CD3CB; --k7:#FF6F8E;
  --k0-ink:#120F3A; --k1-ink:#03140E; --k2-ink:#2E0A18; --k3-ink:#2A1C00; --k4-ink:#1E0B3D; --k5-ink:#06203F; --k6-ink:#04201F; --k7-ink:#2E0812;
  --k0-bg:linear-gradient(90deg,#5145E8 0%,#1E1873 100%); --k1-bg:linear-gradient(90deg,#0E8059 0%,#073D2C 100%); --k2-bg:linear-gradient(90deg,#D6336C 0%,#5C1230 100%); --k3-bg:linear-gradient(90deg,#F5B82E 0%,#C98A10 100%); --k4-bg:linear-gradient(90deg,#7D3CF0 0%,#2E1466 100%); --k5-bg:linear-gradient(90deg,#1F72E0 0%,#0C2F66 100%); --k6-bg:linear-gradient(90deg,#0E8A86 0%,#063B3A 100%); --k7-bg:linear-gradient(90deg,#B5294E 0%,#4A0F21 100%);
  --k0-on:#FFFFFF; --k1-on:#FFFFFF; --k2-on:#FFFFFF; --k3-on:#1A1200; --k4-on:#FFFFFF; --k5-on:#FFFFFF; --k6-on:#FFFFFF; --k7-on:#FFFFFF;
  --edit:#2A2A2A; --edit-ink:#FFFFFF; --nav:#181818; --nav-ink:#B3B3B3; --nav-on:#FFFFFF; --nav-on-ink:#121212;
  --warn:#FFC266; --warn-soft:#3A2D12; color-scheme:dark}
/* Shared prototype chrome: toast + test panel. Uses each direction's tokens. */
#core-toast{position:fixed;inset-inline:0;margin-inline:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100% - 32px);display:flex;gap:16px;align-items:center;padding:12px 16px;border-radius:var(--toast-radius,12px);background:var(--ink);color:var(--bg);font:500 14px/1.4 var(--font-body);box-shadow:0 8px 30px rgb(0 0 0/.25);transform:translateY(16px);opacity:0;pointer-events:none;transition:transform .25s,opacity .25s;z-index:80}
#core-toast.show{transform:none;opacity:1;pointer-events:auto}
#core-toast button{background:none;border:0;color:inherit;font:700 14px var(--font-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
[hidden]{display:none!important}
#proto-fab{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom,0px));left:max(8px,env(safe-area-inset-left,0px));z-index:90;font:600 11px var(--font-body);letter-spacing:.02em;padding:6px 10px;border-radius:99px;border:1px dashed var(--muted);background:var(--bg);color:var(--muted);cursor:pointer;opacity:.85}
#proto-panel{position:fixed;bottom:calc(122px + env(safe-area-inset-bottom,0px));max-height:calc(100% - 140px);overflow:auto;left:max(8px,env(safe-area-inset-left,0px));z-index:91;width:min(320px,calc(100% - 16px));padding:14px;border-radius:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 18px 50px rgb(0 0 0/.25);font:14px/1.4 var(--font-body);display:grid;gap:8px}
#proto-panel .pp-head{display:flex;justify-content:space-between;align-items:center}
#proto-panel .pp-head button{background:none;border:0;color:var(--muted);font-size:16px;cursor:pointer}
#proto-panel .pp-note{margin:0;color:var(--muted);font-size:12px}
#proto-panel .pp-l{font-size:12px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}
#proto-panel .pp-clock{font-variant-numeric:tabular-nums;color:var(--ink)}
#proto-panel .pp-seg,#proto-panel .pp-actions{display:flex;gap:6px;flex-wrap:wrap}
#proto-panel .pp-seg button,#proto-panel .pp-actions button{flex:1;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 13px var(--font-body);cursor:pointer}
#proto-panel [aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body:has(.sheet.on) #proto-fab,body:has(.add-page) #proto-fab,body:has(.over) #proto-fab{display:none}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font-body);direction:rtl;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.cur{font-family:var(--font-body);font-weight:600;font-size:.6em;margin-inline-end:.08em;vertical-align:.12em}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate;direction:ltr;display:inline-block}
.disp{font-family:var(--font-display);font-weight:400;letter-spacing:-.01em}
.app{max-width:1000px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 130px}
.app{position:relative}
.app>*{min-width:0;position:relative;z-index:1}
.app>.glow{position:absolute;z-index:0}
.hello{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hello .who{display:flex;align-items:center;gap:10px}
.hello svg{width:38px;height:38px}
.hello small{display:block;color:var(--muted);font-size:13px}
.hello strong{font-size:16px}
.hero{margin:22px 0 8px}
.glow{position:absolute;inset:0 0 auto 0;height:380px;pointer-events:none;z-index:0;background:radial-gradient(120% 90% at 85% 0%,color-mix(in oklab,var(--glow,#5145E8) 42%,transparent) 0%,transparent 70%)}
:root:not([data-theme=dark]) .glow{opacity:.55}
.hero .lbl{color:var(--muted);font-size:14px;font-weight:500}
.hero .tot{font-family:var(--font-display);font-size:clamp(52px,15vw,84px);line-height:1;letter-spacing:-.02em;margin-top:6px;display:flex;flex-wrap:wrap;gap:0 18px;align-items:baseline}
.hero .tot .sm{font-size:.5em;color:var(--muted)}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:3px;margin:16px 0 10px}
.split i{display:block;height:100%;border-radius:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend b{width:9px;height:9px;border-radius:3px;display:inline-block}
.flag{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:6px 12px;font-weight:600;font-size:14px;cursor:pointer;margin-top:12px}
h2{font-family:var(--font-display);font-weight:400;font-size:22px;margin:30px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2 button{font:500 14px var(--font-body);background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* Passes */
.wallet{display:grid;gap:0}
.pass{border-radius:22px;padding:18px 20px 30px;margin-bottom:-14px;color:var(--pass-ink);background:var(--pass-bg);cursor:pointer;border:0;text-align:start;width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 12px;box-shadow:0 -6px 18px rgb(0 0 0/.06);position:relative;transition:transform .2s}
.pass:last-child{margin-bottom:0;padding-bottom:18px}
.pass:hover{transform:translateY(-3px)}
.pass .n{font-weight:600;font-size:16px}
.pass .h{opacity:.85;font-size:13px}
.pass .a{font-family:var(--font-display);font-size:26px;line-height:1;align-self:center;grid-row:span 2}
.pass.open{margin-bottom:10px;padding-bottom:18px}
.pass .rows{grid-column:1/-1;display:grid;gap:4px;margin-top:12px;border-top:1px solid color-mix(in oklab,var(--pass-ink) 25%,transparent);padding-top:10px}
.pass .rows div{display:flex;justify-content:space-between;font-size:14px}
.now{display:flex;gap:10px;margin-top:22px}
.now button{flex:1;min-height:56px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.now .live{background:var(--ink);color:var(--bg);border-color:var(--ink);justify-content:space-between;padding-inline:18px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--k0);box-shadow:0 0 0 0 var(--k0);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px transparent}}
/* Lists */
.card{display:grid;grid-template-columns:44px 1fr auto;gap:2px 12px;align-items:center;background:var(--surface);border-radius:18px;padding:12px 14px;margin-bottom:8px;cursor:pointer;user-select:none;-webkit-user-select:none;border:1.5px solid transparent}
.card .av{grid-row:span 2;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--font-display);font-size:18px;background:var(--pass);color:var(--pass-ink)}
.card .t{font-weight:600}
.card .s{color:var(--muted);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .m{grid-row:span 2;text-align:start;font-family:var(--font-display);font-size:19px}
.card.plan{background:transparent;border:1.5px dashed var(--acc)}
.card.plan .av{background:transparent;border:1.5px dashed var(--acc);color:var(--acc)}
.card.sel{border-color:var(--ink);background:var(--sunk)}
.card .acts{grid-column:1/-1;display:flex;gap:8px;margin-top:10px}
.card .acts button{flex:1;min-height:42px;border-radius:12px;border:0;background:var(--sunk);font-weight:600;cursor:pointer}
.card .acts .go{background:var(--ink);color:var(--bg)}
.tag{font:600 11px var(--font-body);padding:1px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);margin-inline-start:6px;vertical-align:middle}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.week-h{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:600;margin:18px 4px 8px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{min-height:40px;padding-inline:16px;border-radius:99px;border:1.5px solid var(--line);background:none;font-weight:600;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{color:var(--muted);text-align:center;padding:28px;font-size:15px}
/* Nav */
nav.pill{border:1px solid var(--line);position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);display:flex;gap:4px;padding:6px;border-radius:99px;background:var(--nav);z-index:40;box-shadow:0 10px 30px rgb(0 0 0/.25)}
nav.pill button{border:0;background:none;color:var(--nav-ink);min-height:48px;padding-inline:14px;border-radius:99px;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
nav.pill button[aria-current=page]{background:var(--nav-on);color:var(--nav-on-ink)}
nav.pill .plus{background:var(--k0);color:var(--k0-ink);width:48px;padding:0;justify-content:center;font-size:26px;line-height:1}
/* Add page */
.add-page{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.ap-top{background:var(--pass-bg);color:var(--pass-ink);padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));transition:background .25s}
.ap-in{max-width:560px;margin-inline:auto;display:grid;gap:12px}
.ap-bar{display:flex;justify-content:space-between;align-items:center}
.ap-bar button{border:0;background:color-mix(in oklab,var(--pass-ink) 18%,transparent);color:inherit;min-height:40px;padding-inline:14px;border-radius:99px;font-weight:600;cursor:pointer}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.cats button{flex:0 0 auto;border:1.5px solid color-mix(in oklab,var(--pass-ink) 40%,transparent);background:none;color:inherit;border-radius:99px;min-height:38px;padding-inline:14px;font-weight:600;cursor:pointer}
.cats button[aria-pressed=true]{background:var(--pass-ink);color:var(--pass)}
.clock{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px}
.clock button{border:0;background:none;color:inherit;text-align:start;padding:6px 8px;border-radius:14px;cursor:pointer;display:grid}
.clock button small{font-size:13px;opacity:.85;font-weight:600}
.clock button .disp{font-size:clamp(46px,14vw,64px);line-height:1}
.clock button[aria-pressed=true]{background:color-mix(in oklab,var(--pass-ink) 16%,transparent)}
.clock button.empty .disp{opacity:.45}
.clock .arrow{font-size:22px;opacity:.7;padding-bottom:16px}
.ap-meta{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px;flex-wrap:wrap;gap:6px}
.ap-meta .nx{background:var(--pass-ink);color:var(--pass);border-radius:6px;padding:0 6px;font-size:12px}
.ap-mid{overflow:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.ap-mid .ap-in>*{min-width:0}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days7 button{min-height:54px;border-radius:14px;border:0;background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:12px;color:var(--muted);padding:4px 0}
.days7 button b{font-size:17px;color:var(--ink)}
.days7 button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.days7 button[aria-pressed=true] b{color:var(--bg)}
.chipline{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chipline button,.chipline label{min-height:40px;padding-inline:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chipline button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chipline .sug{border-style:dashed}
.chipline .w{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--surface);border-radius:16px;padding:12px 16px}
.total .disp{font-size:28px}
.msg{font-size:14px;padding:8px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn)}
.msg.err{background:var(--sunk);color:var(--ink)}
.keypad{background:var(--surface);padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgb(0 0 0/.08)}
.keys{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(3,1fr) 1.15fr;gap:8px}
.keys button{min-height:52px;border-radius:14px;border:0;background:var(--sunk);font:500 22px var(--font-body);cursor:pointer;font-variant-numeric:tabular-nums}
.keys button:active{transform:scale(.97)}
.keys .save{grid-column:4;grid-row:span 2;background:var(--ink);color:var(--bg);font:600 17px var(--font-body)}
.keys .save[disabled]{opacity:.35}
.keys .alt{font-size:15px;font-weight:600;color:var(--muted)}
.keys .tgt{grid-column:4;font-size:13px;font-weight:600;background:none;border:1.5px solid var(--line)}
.drawer{display:grid;gap:12px;background:var(--surface);border-radius:18px;padding:14px}
.drawer .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field select{min-height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding-inline:12px}
.sw{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.sw:checked{background:var(--k1)}
.sw:checked::after{inset-inline-start:21px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:500}
.wk{display:grid;grid-template-columns:auto 1fr 88px;gap:10px;align-items:center}
.wk input[type=number]{min-height:38px;border:1.5px solid var(--line);border-radius:10px;padding-inline:8px;background:var(--bg)}
.dsel{display:flex;gap:6px}
.dsel button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:none;font-weight:600;cursor:pointer}
.dsel button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}

/* Round 3: ruler, edit mode, details, share */
.ruler{position:relative;height:86px;margin-top:2px;touch-action:none}
.rbase{position:absolute;inset-inline:0;top:32px;height:12px;border-radius:6px;background:color-mix(in oklab,var(--pass-ink) 22%,transparent)}
#rsegs i{position:absolute;top:32px;height:12px;border-radius:6px;background:var(--pass-ink)}

<script>
/* Salary Calculation 2.0 prototypes: shared behaviour engine.
   Synthetic data only. Every direction renders its own UI on top of this. */
const Core = (() => {
  'use strict';
  const DAY = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
  const DAY_SHORT = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
  const MONTH = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];

  /* ---------- dates & times ---------- */
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
  const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const fromMin = m => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
  const weekday = s => parseYmd(s).getDay();
  const ym = s => s.slice(0, 7);

  let clockOffset = 0; // minutes; the prototype panel can move time forward
  const now = () => new Date(Date.now() + clockOffset * 60000);
  const today = () => ymd(now());
  const nowMin = () => { const n = now(); return n.getHours() * 60 + n.getMinutes(); };
  const roundedEnd = () => fromMin(Math.floor(nowMin() / 30) * 30);

  function dayLabel(s) {
    const t = today();
    if (s === t) return 'היום';
    if (s === addDays(t, -1)) return 'אתמול';
    if (s === addDays(t, 1)) return 'מחר';
    const d = parseYmd(s);
    return `יום ${DAY_SHORT[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}`;
  }
  const shortDate = s => { const d = parseYmd(s); return `${d.getDate()}.${d.getMonth() + 1}`; };
  const monthName = k => { const [y, m] = k.split('-').map(Number); return `${MONTH[m - 1]} ${y}`; };
  const prevMonth = k => { const [y, m] = k.split('-').map(Number); const d = new Date(y, m - 2, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
  const nextMonth = k => { const [y, m] = k.split('-').map(Number); const d = new Date(y, m, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };

  /* Shift span. End earlier than start means the shift crosses midnight. */
  function span(start, end, breakMin = 0) {
    if (!start || !end) return null;
    const s = toMin(start); let e = toMin(end);
    if (e === s) return { minutes: 0, overnight: false, invalid: true, reason: 'שעת ההתחלה והסיום זהות' };
    const overnight = e < s;
    if (overnight) e += 1440;
    const minutes = e - s - (Number(breakMin) || 0);
    if (minutes <= 0) return { minutes: 0, overnight, invalid: true, reason: 'ההפסקה ארוכה מהמשמרת' };
    return { minutes, overnight, invalid: false, long: minutes > 16 * 60 };
  }

  function seed() {

    add(-6, 'c4', '18:00', '01:00', { rate: null, notes: 'חתונה — התעריף עוד לא סוכם' });

      total: round2(3.5 * 35), paid: false, notes: 'תיקוני לוגו מהבית', group: null, auto: false, ruleKey: null });

      group: { workers: [{ name: 'נועה', bonus: 40 }, { name: 'איתי', bonus: 40 }, { name: 'מאיה', bonus: 0 }] },
      notes: 'הפקה עם צוות',
    });

      id: 'r1', cat: 'c1', days: [0, 2, 4], start: '17:00', end: '22:30', rate: 52, currency: '₪',
      from: t, until: addDays(t, 55),
    }, {
      id: 'r2', cat: 'c2', days: [1, 3], start: '16:00', end: '18:00', rate: 120, currency: '₪',

  function load(direction) {

  /* ---------- drafts (add / edit shift) ---------- */

  /* ---------- summaries ---------- */

  function insights(st) {

    if (st.pending) out.push({ kind: 'pending', text: pl(st.pending, 'משמרת אחת ממתינה לתעריף', '# משמרות ממתינות לתעריף') });

    bulk, paid: () => { C.setPaid([...sel], true); C.toast(C.pl(sel.size, 'סומנה כשולמה', '# סומנו כשולמו')); sel.clear(); render(); }, unsel: () => { sel.clear(); render(); },
    closeSheet, help, wrapped: () => wrapped(), wrappedY: () => wrapped(month.slice(0, 4)), ai: () => { S().settings.aiKey = !S().settings.aiKey; C.commit(); }, noop: () => C.toast('לא פעיל באב-טיפוס'),
  };
  A[ds.act]?.();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (d) {
    if (t.id === 'dt' && t.value) { d.date = t.value; drawAdd(); return; }
    if (t.id === 'until') { d.repeat.until = t.value; drawAdd(); return; }
    if (t.id === 'rep') { d.repeat = t.checked ? { days: [C.weekday(d.date)], until: C.addDays(d.date, 56) } : null; drawAdd(); return; }
    if (t.dataset.wb) { d.group.workers[t.dataset.wb].on = t.checked; return; }
    if (t.id === 'brk') { d.breakMin = t.value; drawAdd(); return; }
  }
  if (t.id === 'dpaid') { C.setPaid([t.dataset.id2], t.checked); openDetail(t.dataset.id2); C.toast(t.checked ? 'סומנה כשולמה' : 'סומנה כלא שולמה'); return; }
  const s = S().settings;
  if (t.id === 'auto') { s.autoConfirm = t.checked; C.commit(); if (t.checked) { const x = C.catchUp(); C.commit(); if (x.length) C.toast(C.pl(x.length, 'משמרת אחת נרשמה', '# משמרות נרשמו'), 'ביטול', () => C.undoAuto(x)); } }
  if (t.id === 'qon') { s.quiet = t.checked; C.commit(); C.toast(t.checked ? `מצב שינה פעיל: ${s.quietFrom}–${s.quietTo}` : 'מצב שינה כבוי'); return; }
  if ((t.id === 'qf' || t.id === 'qt') && t.value) { s[t.id === 'qf' ? 'quietFrom' : 'quietTo'] = t.value; C.commit(); return; }
    if (t.id === 'hap') { s.haptics = t.checked; C.commit(); if (t.checked) C.haptic('success'); }
  if (t.id === 'nmo') { s.notifyMonthly = t.checked; C.commit(); }
  if (t.id === 'nr') { s.notifyRate = t.checked; C.commit(); }
  if (t.id === 'defcat') { s.defaultCat = t.value; C.commit(); }
});
document.addEventListener('input', e => { const t = e.target; if (!d) return; if (t.id === 'nt') d.notes = t.value; if (t.dataset.wv) d.group.workers[t.dataset.wv].bonus = Number(t.value) || 0; });
document.addEventListener('keydown', e => {
  if (d && $('.add-page') && !/INPUT|SELECT/.test(document.activeElement.tagName)) {
    if (/^[0-9]$/.test(e.key)) { pad = true; key(e.key); e.preventDefault(); } else if (e.key === 'Backspace') { key('⌫'); e.preventDefault(); } else if (e.key === 'Enter') { $('[data-act=save]:not([disabled])')?.click(); }
  }
  if (e.key === 'Escape') { if ($('#layer').innerHTML) closeSheet(); else if (d) closeAdd(); document.querySelector('.over,.brandp')?.remove(); }
});
C.longPress(document.body, '.card[data-id]', el => { sel.add(el.dataset.id); render(); });
setInterval(() => { const el = $('#tick'); if (el && S().timer) { const s = C.timerElapsed(); el.textContent = `${Math.floor(s / 3600)}:${C.pad(Math.floor(s / 60) % 60)}:${C.pad(s % 60)}`; } }, 1000);
C.subscribe(() => { if (!d) render(); });
C.mountPanel({ name: 'כיוון ב׳ · כיס', onBrand: brand, onWrapped: () => { month = C.ym(C.today()); wrapped(); } });
render();
const auto = C.catchUp(); if (auto.length) { C.commit(); C.toast(C.pl(auto.length, 'משמרת קבועה הסתיימה ונרשמה', '# משמרות קבועות הסתיימו ונרשמו'), 'ביטול', () => C.undoAuto(auto)); }
})();
</script>
