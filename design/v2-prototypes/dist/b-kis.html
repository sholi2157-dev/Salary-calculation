<title>חישוב שכר · כיס</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: wallet of coloured workplace passes; ink pill navigation; a full-screen keypad for entry. Colour belongs to workplaces, actions are ink. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --sunk:#E2E6EE; --ink:#0D1015; --muted:#5D6573; --line:#D6DBE4;
  --accent:#0D1015; --on-accent:#FFFFFF;
  --k0:#FF5A36; --k1:#10A87A; --k2:#3A63F5; --k3:#F5A300;
  --k0-ink:#FFFFFF; --k1-ink:#FFFFFF; --k2-ink:#FFFFFF; --k3-ink:#2A1C00;
  --warn:#B25E00; --warn-soft:#FFEBC7;
  --font-body:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --font-display:"Secular One","Rubik",system-ui,sans-serif;
  --toast-radius:99px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090B10; --surface:#14181F; --sunk:#1D222B; --ink:#F1F3F7; --muted:#98A1AF; --line:#262C37; --accent:#F1F3F7; --on-accent:#090B10;
  --k0:#FF7152; --k1:#2CC796; --k2:#6B8BFF; --k3:#FFBD33; --k3-ink:#2A1C00; --warn:#FFC266; --warn-soft:#3A2808; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090B10; --surface:#14181F; --sunk:#1D222B; --ink:#F1F3F7; --muted:#98A1AF; --line:#262C37; --accent:#F1F3F7; --on-accent:#090B10;
  --k0:#FF7152; --k1:#2CC796; --k2:#6B8BFF; --k3:#FFBD33; --k3-ink:#2A1C00; --warn:#FFC266; --warn-soft:#3A2808; color-scheme:dark}
/* Shared prototype chrome: toast + test panel. Uses each direction's tokens. */
#core-toast{position:fixed;inset-inline:0;margin-inline:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100% - 32px);display:flex;gap:16px;align-items:center;padding:12px 16px;border-radius:var(--toast-radius,12px);background:var(--ink);color:var(--bg);font:500 14px/1.4 var(--font-body);box-shadow:0 8px 30px rgb(0 0 0/.25);transform:translateY(16px);opacity:0;pointer-events:none;transition:transform .25s,opacity .25s;z-index:80}
#core-toast.show{transform:none;opacity:1;pointer-events:auto}
#core-toast button{background:none;border:0;color:inherit;font:700 14px var(--font-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
[hidden]{display:none!important}
#proto-fab{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom,0px));left:max(8px,env(safe-area-inset-left,0px));z-index:90;font:600 11px var(--font-body);letter-spacing:.02em;padding:6px 10px;border-radius:99px;border:1px dashed var(--muted);background:var(--bg);color:var(--muted);cursor:pointer;opacity:.85}
#proto-panel{position:fixed;bottom:calc(122px + env(safe-area-inset-bottom,0px));max-height:calc(100% - 140px);overflow:auto;left:max(8px,env(safe-area-inset-left,0px));z-index:91;width:min(320px,calc(100% - 16px));padding:14px;border-radius:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 18px 50px rgb(0 0 0/.25);font:14px/1.4 var(--font-body);display:grid;gap:8px}
#proto-panel .pp-head{display:flex;justify-content:space-between;align-items:center}
#proto-panel .pp-head button{background:none;border:0;color:var(--muted);font-size:16px;cursor:pointer}
#proto-panel .pp-note{margin:0;color:var(--muted);font-size:12px}
#proto-panel .pp-l{font-size:12px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}
#proto-panel .pp-clock{font-variant-numeric:tabular-nums;color:var(--ink)}
#proto-panel .pp-seg,#proto-panel .pp-actions{display:flex;gap:6px;flex-wrap:wrap}
#proto-panel .pp-seg button,#proto-panel .pp-actions button{flex:1;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 13px var(--font-body);cursor:pointer}
#proto-panel [aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body:has(.sheet.on) #proto-fab,body:has(.add-page) #proto-fab,body:has(.over) #proto-fab{display:none}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font-body);direction:rtl;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.cur{font-family:var(--font-body);font-weight:600;font-size:.6em;margin-inline-end:.08em;vertical-align:.12em}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate;direction:ltr;display:inline-block}
.disp{font-family:var(--font-display);font-weight:400;letter-spacing:-.01em}
.app{max-width:1000px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 130px}
.app>*{min-width:0}
.hello{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hello .who{display:flex;align-items:center;gap:10px}
.hello svg{width:38px;height:38px}
.hello small{display:block;color:var(--muted);font-size:13px}
.hello strong{font-size:16px}
.hero{margin:22px 0 8px}
.hero .lbl{color:var(--muted);font-size:14px;font-weight:500}
.hero .tot{font-family:var(--font-display);font-size:clamp(52px,15vw,84px);line-height:1;letter-spacing:-.02em;margin-top:6px;display:flex;flex-wrap:wrap;gap:0 18px;align-items:baseline}
.hero .tot .sm{font-size:.5em;color:var(--muted)}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:3px;margin:16px 0 10px}
.split i{display:block;height:100%;border-radius:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend b{width:9px;height:9px;border-radius:3px;display:inline-block}
.flag{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:6px 12px;font-weight:600;font-size:14px;cursor:pointer;margin-top:12px}
h2{font-family:var(--font-display);font-weight:400;font-size:22px;margin:30px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2 button{font:500 14px var(--font-body);background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* Passes */
.wallet{display:grid;gap:0}
.pass{border-radius:22px;padding:18px 20px 30px;margin-bottom:-14px;color:var(--pass-ink);background:var(--pass);cursor:pointer;border:0;text-align:start;width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 12px;box-shadow:0 -6px 18px rgb(0 0 0/.06);position:relative;transition:transform .2s}
.pass:last-child{margin-bottom:0;padding-bottom:18px}
.pass:hover{transform:translateY(-3px)}
.pass .n{font-weight:600;font-size:16px}
.pass .h{opacity:.85;font-size:13px}
.pass .a{font-family:var(--font-display);font-size:26px;line-height:1;align-self:center;grid-row:span 2}
.pass.open{margin-bottom:10px;padding-bottom:18px}
.pass .rows{grid-column:1/-1;display:grid;gap:4px;margin-top:12px;border-top:1px solid color-mix(in oklab,var(--pass-ink) 25%,transparent);padding-top:10px}
.pass .rows div{display:flex;justify-content:space-between;font-size:14px}
.now{display:flex;gap:10px;margin-top:22px}
.now button{flex:1;min-height:56px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.now .live{background:var(--ink);color:var(--bg);border-color:var(--ink);justify-content:space-between;padding-inline:18px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--k0);box-shadow:0 0 0 0 var(--k0);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px transparent}}
/* Lists */
.card{display:grid;grid-template-columns:44px 1fr auto;gap:2px 12px;align-items:center;background:var(--surface);border-radius:18px;padding:12px 14px;margin-bottom:8px;cursor:pointer;user-select:none;-webkit-user-select:none;border:1.5px solid transparent}
.card .av{grid-row:span 2;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--font-display);font-size:18px;background:var(--pass);color:var(--pass-ink)}
.card .t{font-weight:600}
.card .s{color:var(--muted);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .m{grid-row:span 2;text-align:start;font-family:var(--font-display);font-size:19px}
.card.plan{background:transparent;border:1.5px dashed var(--pass)}
.card.plan .av{background:transparent;border:1.5px dashed var(--pass);color:var(--pass)}
.card.sel{border-color:var(--ink);background:var(--sunk)}
.card .acts{grid-column:1/-1;display:flex;gap:8px;margin-top:10px}
.card .acts button{flex:1;min-height:42px;border-radius:12px;border:0;background:var(--sunk);font-weight:600;cursor:pointer}
.card .acts .go{background:var(--ink);color:var(--bg)}
.tag{font:600 11px var(--font-body);padding:1px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);margin-inline-start:6px;vertical-align:middle}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.week-h{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:600;margin:18px 4px 8px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{min-height:40px;padding-inline:16px;border-radius:99px;border:1.5px solid var(--line);background:none;font-weight:600;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{color:var(--muted);text-align:center;padding:28px;font-size:15px}
/* Nav */
nav.pill{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);display:flex;gap:4px;padding:6px;border-radius:99px;background:var(--ink);z-index:40;box-shadow:0 10px 30px rgb(0 0 0/.25)}
nav.pill button{border:0;background:none;color:color-mix(in oklab,var(--bg) 70%,transparent);min-height:48px;padding-inline:14px;border-radius:99px;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
nav.pill button[aria-current=page]{background:var(--bg);color:var(--ink)}
nav.pill .plus{background:var(--k0);color:#fff;width:48px;padding:0;justify-content:center;font-size:26px;line-height:1}
/* Add page */
.add-page{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.ap-top{background:var(--pass);color:var(--pass-ink);padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));transition:background .25s}
.ap-in{max-width:560px;margin-inline:auto;display:grid;gap:12px}
.ap-bar{display:flex;justify-content:space-between;align-items:center}
.ap-bar button{border:0;background:color-mix(in oklab,var(--pass-ink) 18%,transparent);color:inherit;min-height:40px;padding-inline:14px;border-radius:99px;font-weight:600;cursor:pointer}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.cats button{flex:0 0 auto;border:1.5px solid color-mix(in oklab,var(--pass-ink) 40%,transparent);background:none;color:inherit;border-radius:99px;min-height:38px;padding-inline:14px;font-weight:600;cursor:pointer}
.cats button[aria-pressed=true]{background:var(--pass-ink);color:var(--pass)}
.clock{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px}
.clock button{border:0;background:none;color:inherit;text-align:start;padding:6px 8px;border-radius:14px;cursor:pointer;display:grid}
.clock button small{font-size:13px;opacity:.85;font-weight:600}
.clock button .disp{font-size:clamp(46px,14vw,64px);line-height:1}
.clock button[aria-pressed=true]{background:color-mix(in oklab,var(--pass-ink) 16%,transparent)}
.clock button.empty .disp{opacity:.45}
.clock .arrow{font-size:22px;opacity:.7;padding-bottom:16px}
.ap-meta{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px;flex-wrap:wrap;gap:6px}
.ap-meta .nx{background:var(--pass-ink);color:var(--pass);border-radius:6px;padding:0 6px;font-size:12px}
.ap-mid{overflow:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.ap-mid .ap-in>*{min-width:0}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days7 button{min-height:54px;border-radius:14px;border:0;background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:12px;color:var(--muted);padding:4px 0}
.days7 button b{font-size:17px;color:var(--ink)}
.days7 button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.days7 button[aria-pressed=true] b{color:var(--bg)}
.chipline{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chipline button,.chipline label{min-height:40px;padding-inline:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chipline button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chipline .sug{border-style:dashed}
.chipline .w{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--surface);border-radius:16px;padding:12px 16px}
.total .disp{font-size:28px}
.msg{font-size:14px;padding:8px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn)}
.msg.err{background:var(--sunk);color:var(--ink)}
.keypad{background:var(--surface);padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgb(0 0 0/.08)}
.keys{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(3,1fr) 1.15fr;gap:8px}
.keys button{min-height:52px;border-radius:14px;border:0;background:var(--sunk);font:500 22px var(--font-body);cursor:pointer;font-variant-numeric:tabular-nums}
.keys button:active{transform:scale(.97)}
.keys .save{grid-column:4;grid-row:span 2;background:var(--ink);color:var(--bg);font:600 17px var(--font-body)}
.keys .save[disabled]{opacity:.35}
.keys .alt{font-size:15px;font-weight:600;color:var(--muted)}
.keys .tgt{grid-column:4;font-size:13px;font-weight:600;background:none;border:1.5px solid var(--line)}
.drawer{display:grid;gap:12px;background:var(--surface);border-radius:18px;padding:14px}
.drawer .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field select{min-height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding-inline:12px}
.sw{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.sw:checked{background:var(--k1)}
.sw:checked::after{inset-inline-start:21px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:500}
.wk{display:grid;grid-template-columns:auto 1fr 88px;gap:10px;align-items:center}
.wk input[type=number]{min-height:38px;border:1.5px solid var(--line);border-radius:10px;padding-inline:8px;background:var(--bg)}
.dsel{display:flex;gap:6px}
.dsel button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:none;font-weight:600;cursor:pointer}
.dsel button[aria-pressed=true]{background:var(--pass);color:var(--pass-ink);border-color:var(--pass)}
/* Sheets */
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.4);z-index:70}
.sheet{position:fixed;inset:auto 0 0 0;z-index:71;background:var(--surface);border-radius:26px 26px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:85%;overflow:auto;animation:up .28s}
.sheet .in{max-width:560px;margin-inline:auto;display:grid;gap:12px}
.sheet .in>*{min-width:0}
.sheet h3{font-family:var(--font-display);font-weight:400;font-size:24px;margin:0}
.big-btn{min-height:54px;border-radius:16px;border:0;background:var(--ink);color:var(--bg);font-weight:600;font-size:16px;cursor:pointer;width:100%}
.big-btn.ghost{background:var(--sunk);color:var(--ink)}
.big-btn[disabled]{opacity:.35}
.selbar{position:fixed;inset:auto 0 0 0;z-index:45;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--bg);border-radius:22px 22px 0 0}
.selbar .in{max-width:560px;margin-inline:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.selbar strong{margin-inline-end:auto;font-family:var(--font-display);font-weight:400;font-size:20px}
.selbar button{min-height:42px;border-radius:12px;border:0;background:color-mix(in oklab,var(--bg) 16%,transparent);color:var(--bg);font-weight:600;padding-inline:14px;cursor:pointer}
/* Settings */
.sgroup{background:var(--surface);border-radius:20px;padding:4px 16px}
.srow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);min-height:58px}
.srow:last-child{border-bottom:0}
.srow .l{flex:1;min-width:0}
.srow .l small{display:block;color:var(--muted);font-size:13px}
.srow select{min-height:40px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding-inline:8px}
.q{width:24px;height:24px;border-radius:50%;border:0;background:var(--sunk);color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;margin-inline-start:6px;vertical-align:middle}
.help h4{margin:0;font-size:17px}
.help p{margin:0;color:var(--muted)}
.help ol{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.help a{color:var(--k2);font-weight:600}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:140px}
.bars div{display:grid;gap:6px;justify-items:center;align-content:end;height:100%}
.bars i{width:100%;max-width:34px;border-radius:10px;background:var(--sunk);min-height:6px}
.bars i.top{background:var(--k0)}
.bars span{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border-radius:18px;padding:14px 16px}
.tile small{color:var(--muted);font-size:13px}
.tile .disp{font-size:26px;display:block;margin-top:2px}
.ins{display:grid;gap:8px}
.ins div{background:var(--surface);border-radius:16px;padding:12px 16px;font-weight:500}
/* Wrapped */
.over{position:fixed;inset:0;z-index:80;background:var(--slide);color:var(--slide-ink);display:grid;grid-template-rows:auto 1fr auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));transition:background .4s}
.prog{display:flex;gap:5px}
.prog i{flex:1;height:4px;border-radius:2px;background:color-mix(in oklab,var(--slide-ink) 25%,transparent)}
.prog i.on{background:var(--slide-ink)}
.slide{align-self:center;max-width:560px;margin-inline:auto;width:100%;display:grid;gap:12px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.slide .e{font-weight:600;opacity:.8}
.slide .x1{font-family:var(--font-display);font-size:clamp(84px,30vw,170px);line-height:.9;letter-spacing:-.03em}
.slide h3{font-family:var(--font-display);font-weight:400;font-size:clamp(28px,8vw,44px);line-height:1.1;margin:0;text-wrap:balance}
.slide p{margin:0;font-size:17px;opacity:.85}
.over .ctl{display:flex;justify-content:space-between;max-width:560px;margin-inline:auto;width:100%;gap:8px}
.over .ctl button{min-height:50px;border-radius:99px;border:2px solid var(--slide-ink);background:none;color:var(--slide-ink);font-weight:600;padding-inline:20px;cursor:pointer}

<div id="layer"></div>

<script>
/* Salary Calculation 2.0 prototypes: shared behaviour engine.
   Synthetic data only. Every direction renders its own UI on top of this. */
const Core = (() => {
  'use strict';
  const DAY = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
  const DAY_SHORT = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
  const MONTH = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];

  /* ---------- dates & times ---------- */
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
  const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const fromMin = m => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
  const weekday = s => parseYmd(s).getDay();
  const ym = s => s.slice(0, 7);

  let clockOffset = 0; // minutes; the prototype panel can move time forward
  const now = () => new Date(Date.now() + clockOffset * 60000);
  const today = () => ymd(now());
  const nowMin = () => { const n = now(); return n.getHours() * 60 + n.getMinutes(); };
  const roundedEnd = () => fromMin(Math.floor(nowMin() / 30) * 30);

  function dayLabel(s) {
    const t = today();
    if (s === t) return 'היום';
    if (s === addDays(t, -1)) return 'אתמול';
    if (s === addDays(t, 1)) return 'מחר';
    const d = parseYmd(s);
    return `יום ${DAY_SHORT[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}`;
  }
  const shortDate = s => { const d = parseYmd(s); return `${d.getDate()}.${d.getMonth() + 1}`; };
  const monthName = k => { const [y, m] = k.split('-').map(Number); return `${MONTH[m - 1]} ${y}`; };
  const prevMonth = k => { const [y, m] = k.split('-').map(Number); const d = new Date(y, m - 2, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
  const nextMonth = k => { const [y, m] = k.split('-').map(Number); const d = new Date(y, m, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };

  /* Shift span. End earlier than start means the shift crosses midnight. */
  function span(start, end, breakMin = 0) {
    if (!start || !end) return null;
    const s = toMin(start); let e = toMin(end);
    if (e === s) return { minutes: 0, overnight: false, invalid: true, reason: 'שעת ההתחלה והסיום זהות' };
    const overnight = e < s;
    if (overnight) e += 1440;
    const minutes = e - s - (Number(breakMin) || 0);
    if (minutes <= 0) return { minutes: 0, overnight, invalid: true, reason: 'ההפסקה ארוכה מהמשמרת' };
    return { minutes, overnight, invalid: false, long: minutes > 16 * 60 };
  }
  const endDateTime = (date, start, end) => {
    const d = parseYmd(date); const s = toMin(start); let e = toMin(end); if (e <= s) e += 1440;
    d.setMinutes(e); return d;
  };
  const startDateTime = (date, start) => { const d = parseYmd(date); d.setMinutes(toMin(start)); return d; };

  /* ---------- formatting ---------- */
  const nf = new Intl.NumberFormat('he-IL', { maximumFractionDigits: 2 });
  const nf0 = new Intl.NumberFormat('he-IL', { maximumFractionDigits: 0 });
  const money = (v, cur, whole) => cur + (whole ? nf0 : nf).format(v);
  const hours = mins => { const h = mins / 60; return (Math.round(h * 100) / 100).toLocaleString('he-IL', { maximumFractionDigits: 2 }); };
  const hm = mins => `${Math.floor(mins / 60)}:${pad(mins % 60)}`;
  const round2 = v => Math.round((v + Number.EPSILON) * 100) / 100;
  const pl = (n, one, many) => n === 1 ? one : many.replace('#', n);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- state ---------- */
  let KEY = 'salary-v2-proto';
  let state;
  const listeners = new Set();
  const uid = () => Math.random().toString(36).slice(2, 10);

  const CATS = [
    { id: 'c1', name: 'מסעדת הנמל', rate: 52, currency: '₪', hue: 0 },
    { id: 'c2', name: 'שיעורים פרטיים', rate: 120, currency: '₪', hue: 1 },
    { id: 'c3', name: 'פרילנס — עיצוב', rate: 35, currency: '$', hue: 2 },
    { id: 'c4', name: 'גן אירועים אלמוג', rate: null, currency: '₪', hue: 3 },
  ];
  const WORKERS = ['נועה', 'איתי', 'מאיה', 'עומר'];

  function seed() {
    const t = today();
    const shifts = [];
    const add = (offset, cat, start, end, extra = {}) => {
      const date = addDays(t, offset);
      const c = CATS.find(x => x.id === cat);
      const rate = 'rate' in extra ? extra.rate : c.rate;
      const sp = span(start, end, extra.breakMin || 0);
      const bonus = extra.bonus || 0;
      shifts.push({
        id: uid(), cat, date, start, end, breakMin: extra.breakMin || 0, rate, currency: c.currency, bonus,
        total: rate == null ? null : round2(sp.minutes / 60 * rate + bonus),
        paid: offset < -13, notes: extra.notes || '', group: extra.group || null, auto: false, ruleKey: null,
      });
    };
    // Six weeks of a realistic mixed pattern.
    for (let off = -44; off <= -1; off++) {
      const wd = weekday(addDays(t, off));
      if (wd === 0 || wd === 2) add(off, 'c1', '17:00', off % 3 === 0 ? '23:00' : '22:30');
      if (wd === 4 && off < -7) add(off, 'c1', '17:00', '22:30');
      if (wd === 1 || wd === 3) add(off, 'c2', '16:00', '18:00');
      if (wd === 5 && off % 2 === 0) add(off, 'c3', '09:00', '13:30', { breakMin: 30 });
    }
    // Details that show the new behaviour.
    add(-9, 'c1', '20:00', '02:00', { bonus: 50, notes: 'סגירה של אירוע פרטי' });
    add(-6, 'c4', '18:00', '01:00', { rate: null, notes: 'חתונה — התעריף עוד לא סוכם' });
    add(-2, 'c4', '19:00', '00:30', { rate: null });
    add(-12, 'c4', '17:30', '23:30', {
      rate: 45, bonus: 40,
      group: { workers: [{ name: 'נועה', bonus: 40 }, { name: 'איתי', bonus: 40 }, { name: 'מאיה', bonus: 0 }] },
      notes: 'הפקה עם צוות',
    });
    const rules = [{
      id: 'r1', cat: 'c1', days: [0, 2, 4], start: '17:00', end: '22:30', rate: 52, currency: '₪',
      from: t, until: addDays(t, 55),
    }, {
      id: 'r2', cat: 'c2', days: [1, 3], start: '16:00', end: '18:00', rate: 120, currency: '₪',
      from: addDays(t, 1), until: addDays(t, 40),
    }];
    return {
      v: 1, cats: CATS.map(c => ({ ...c })), workers: [...WORKERS], shifts, rules, exceptions: {},
      settings: {
        autoConfirm: true, notifyMonthly: true, notifyRate: true, rateFrequency: 'weekly',
        planningView: 'unified', defaultCat: 'c1', aiKey: false, theme: 'system',
      },
      lastAuto: [], clockOffset: 0,
    };
  }

  function load(direction) {
    KEY = 'salary-v2-proto-' + direction;
    try { state = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch { state = null; }
    if (!state || state.v !== 1) state = seed();
    clockOffset = state.clockOffset || 0;
    return state;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { /* storage may be blocked */ } }
  function commit() { save(); listeners.forEach(fn => fn(state)); }
  const subscribe = fn => listeners.add(fn);
  function reset() { state = seed(); clockOffset = 0; commit(); }
  function advance(minutes) { clockOffset += minutes; state.clockOffset = clockOffset; const done = catchUp(); commit(); return done; }

  const cat = id => state.cats.find(c => c.id === id) || state.cats[0];

  /* ---------- planned shifts ---------- */
  const occKey = (ruleId, date) => `${ruleId}@${date}`;
  function occurrences() {
    const out = [];
    const confirmed = new Set(state.shifts.filter(s => s.ruleKey).map(s => s.ruleKey));
    for (const r of state.rules) {
      for (let d = r.from; d <= r.until; d = addDays(d, 1)) {
        if (!r.days.includes(weekday(d))) continue;
        const key = occKey(r.id, d);
        if (confirmed.has(key)) continue;
        const ex = state.exceptions[key] || {};
        if (ex.cancelled) continue;
        const o = { key, ruleId: r.id, cat: r.cat, date: d, start: ex.start || r.start, end: ex.end || r.end,
          rate: 'rate' in ex ? ex.rate : r.rate, currency: r.currency, bonus: ex.bonus || 0, edited: !!ex.start || 'rate' in ex };
        o.status = endDateTime(o.date, o.start, o.end) <= now() ? 'awaiting' : 'planned';
        out.push(o);
      }
    }
    return out.sort((a, b) => startDateTime(a.date, a.start) - startDateTime(b.date, b.start));
  }
  function shiftFromOcc(o, auto) {
    const sp = span(o.start, o.end);
    return { id: uid(), cat: o.cat, date: o.date, start: o.start, end: o.end, breakMin: 0, rate: o.rate, currency: o.currency,
      bonus: o.bonus || 0, total: o.rate == null ? null : round2(sp.minutes / 60 * o.rate + (o.bonus || 0)),
      paid: false, notes: '', group: null, auto, ruleKey: o.key };
  }
  /* Safe catch-up: idempotent because each occurrence key can be confirmed once. */
  function catchUp() {
    if (!state.settings.autoConfirm) return [];
    const done = [];
    for (const o of occurrences()) if (o.status === 'awaiting' && !state.exceptions[o.key]?.hold) { const s = shiftFromOcc(o, true); state.shifts.push(s); done.push(s.id); }
    if (done.length) state.lastAuto = done;
    return done;
  }
  function undoAuto(ids) {
    // Undo turns them back into planned/awaiting occurrences; nothing else changes.
    for (const s of state.shifts) if (ids.includes(s.id) && s.ruleKey) state.exceptions[s.ruleKey] = { ...(state.exceptions[s.ruleKey] || {}), hold: true };
    state.shifts = state.shifts.filter(s => !ids.includes(s.id));
    commit();
  }
  function confirmOcc(key) { const o = occurrences().find(x => x.key === key); if (o) { state.shifts.push(shiftFromOcc(o, false)); commit(); } }
  function cancelOcc(key) { state.exceptions[key] = { ...(state.exceptions[key] || {}), cancelled: true }; commit(); }
  function restoreOcc(key) { const ex = state.exceptions[key]; if (ex) delete ex.cancelled; commit(); }
  function editOcc(key, patch, scope) {
    const [ruleId, date] = key.split('@');
    const r = state.rules.find(x => x.id === ruleId);
    if (scope === 'one') { state.exceptions[key] = { ...(state.exceptions[key] || {}), ...patch }; }
    else {
      // This and following: end the old series the day before, start a new one.
      const nr = { ...r, id: 'r' + uid(), from: date, ...patch };
      r.until = addDays(date, -1);
      state.rules.push(nr);
    }
    commit();
  }
  function futureCount(ruleId) { return occurrences().filter(o => o.ruleId === ruleId && o.status === 'planned').length; }
  function applyRateToFuture(ruleId, rate) {
    const r = state.rules.find(x => x.id === ruleId); r.rate = rate;
    for (const o of occurrences()) if (o.ruleId === ruleId && o.status === 'planned' && state.exceptions[o.key]) delete state.exceptions[o.key].rate;
    commit();
  }
  function previewRule(rule) {
    const dates = [];
    for (let d = rule.from; d <= rule.until; d = addDays(d, 1)) if (rule.days.includes(weekday(d))) dates.push(d);
    const occ = occurrences();
    const clashes = dates.filter(d => occ.some(o => o.date === d && overlaps(o, rule)) || state.shifts.some(s => s.date === d && overlaps(s, rule)));
    return { dates, clashes };
  }
  function overlaps(a, b) {
    const as = toMin(a.start), bs = toMin(b.start);
    let ae = toMin(a.end), be = toMin(b.end); if (ae <= as) ae += 1440; if (be <= bs) be += 1440;
    return as < be && bs < ae;
  }

  /* ---------- drafts (add / edit shift) ---------- */
  function suggestStart(catId, date) {
    const same = state.shifts.filter(s => s.cat === catId && weekday(s.date) === weekday(date));
    const mode = list => { const m = {}; list.forEach(s => m[s.start] = (m[s.start] || 0) + 1); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
    const strong = mode(same);
    const chips = mode(state.shifts.filter(s => s.cat === catId)).slice(0, 3).map(x => x[0]);
    const fallback = chips.length ? chips : mode(state.shifts).slice(0, 3).map(x => x[0]);
    return { start: strong.length && strong[0][1] >= 3 ? strong[0][0] : null, chips: fallback };
  }
  function newDraft(over = {}) {
    const c = cat(state.settings.defaultCat);
    const d = { id: null, cat: c.id, date: today(), start: null, end: roundedEnd(), breakMin: 0, rate: c.rate, rateUnknown: c.rate == null,
      currency: c.currency, bonus: 0, bonusTarget: 'me', notes: '', group: null, repeat: null, ...over };
    if (!over.start) d.start = suggestStart(d.cat, d.date).start;
    return d;
  }
  function draftFromShift(s) {
    return { id: s.id, cat: s.cat, date: s.date, start: s.start, end: s.end, breakMin: s.breakMin, rate: s.rate, rateUnknown: s.rate == null,
      currency: s.currency, bonus: s.bonus, bonusTarget: 'me', notes: s.notes, group: s.group ? JSON.parse(JSON.stringify(s.group)) : null, repeat: null, auto: s.auto };
  }
  function setDraftCat(d, id) {
    const c = cat(id); d.cat = id; d.currency = c.currency;
    if (!d.id) { d.rate = c.rate; d.rateUnknown = c.rate == null; const s = suggestStart(id, d.date); if (s.start) d.start = s.start; }
  }
  function evaluate(d) {
    const errors = [], warnings = [];
    if (!d.start) errors.push('בחר שעת התחלה');
    const sp = d.start ? span(d.start, d.end, d.breakMin) : null;
    if (sp && sp.invalid) errors.push(sp.reason);
    if (sp && sp.long) warnings.push('משמרת של יותר מ-16 שעות. לוודא?');
    if (sp && sp.overnight && toMin(d.end) > toMin(d.start) - 60 && sp.minutes > 20 * 60) warnings.push('נראה כמו טעות בשעות');
    const rate = d.rateUnknown ? null : Number(d.rate);
    if (!d.rateUnknown && !(rate >= 0)) errors.push('הזן תעריף, או סמן "תעריף חסר"');
    const myBonus = d.group ? (d.bonusTarget === 'others' ? 0 : Number(d.bonus) || 0) : Number(d.bonus) || 0;
    const base = sp && !sp.invalid && rate != null ? sp.minutes / 60 * rate : null;
    return { errors, warnings, span: sp, base, bonus: myBonus, total: base == null ? null : round2(base + myBonus) };
  }
  function saveDraft(d) {
    const ev = evaluate(d);
    if (ev.errors.length) return { ok: false, errors: ev.errors };
    if (d.repeat) {
      const r = { id: 'r' + uid(), cat: d.cat, days: d.repeat.days, start: d.start, end: d.end, rate: d.rateUnknown ? null : Number(d.rate),
        currency: d.currency, from: d.date, until: d.repeat.until };
      state.rules.push(r); const done = catchUp(); commit();
      return { ok: true, rule: r, auto: done };
    }
    const rec = { cat: d.cat, date: d.date, start: d.start, end: d.end, breakMin: Number(d.breakMin) || 0, rate: d.rateUnknown ? null : Number(d.rate),
      currency: d.currency, bonus: ev.bonus, total: ev.total, notes: d.notes, group: d.group };
    if (d.id) { const s = state.shifts.find(x => x.id === d.id); Object.assign(s, rec, { auto: false }); }
    else state.shifts.push({ id: uid(), paid: false, auto: false, ruleKey: null, ...rec });
    commit(); return { ok: true };
  }
  function deleteShift(id) { const i = state.shifts.findIndex(s => s.id === id); const [s] = state.shifts.splice(i, 1); commit(); return s; }
  function restoreShift(s) { state.shifts.push(s); commit(); }

  /* Bulk rate completion: writes only to shifts whose rate is missing. */
  function bulkRatePreview(ids, rate) {
    const list = state.shifts.filter(s => ids.includes(s.id));
    const target = list.filter(s => s.rate == null);
    return { target: target.map(s => ({ ...s, newTotal: round2(span(s.start, s.end, s.breakMin).minutes / 60 * rate + (s.bonus || 0)) })), skipped: list.length - target.length };
  }
  function bulkRateApply(ids, rate) {
    const done = [];
    for (const s of state.shifts) if (ids.includes(s.id) && s.rate == null) {
      s.rate = rate; s.total = round2(span(s.start, s.end, s.breakMin).minutes / 60 * rate + (s.bonus || 0)); done.push(s.id);
    }
    commit(); return done;
  }
  function setPaid(ids, paid) { state.shifts.forEach(s => { if (ids.includes(s.id)) s.paid = paid; }); commit(); }

  /* ---------- summaries ---------- */
  const shiftMinutes = s => span(s.start, s.end, s.breakMin).minutes;
  function monthStats(k) {
    const list = state.shifts.filter(s => ym(s.date) === k);
    const byCur = {};
    let minutes = 0, pending = 0;
    for (const s of list) {
      const m = shiftMinutes(s); minutes += m;
      if (s.total == null) { pending++; continue; }
      const c = byCur[s.currency] ||= { total: 0, paid: 0, unpaid: 0, minutes: 0 };
      c.total += s.total; c.minutes += m; s.paid ? c.paid += s.total : c.unpaid += s.total;
    }
    // Compare like with like: for the running month, only the same days of last month.
    const cutoff = k === ym(today()) ? Number(today().slice(8)) : 31;
    const prev = state.shifts.filter(s => ym(s.date) === prevMonth(k) && Number(s.date.slice(8)) <= cutoff).reduce((a, s) => a + shiftMinutes(s), 0);
    const days = Array(7).fill(0); list.forEach(s => days[weekday(s.date)] += shiftMinutes(s));
    const cats = {}; list.forEach(s => cats[s.cat] = (cats[s.cat] || 0) + shiftMinutes(s));
    const planned = occurrences().filter(o => ym(o.date) === k && o.status === 'planned');
    const plannedMin = planned.reduce((a, o) => a + span(o.start, o.end).minutes, 0);
    return { k, list, count: list.length, minutes, byCur, pending, prevMinutes: prev, days, cats, planned: planned.length, plannedMin };
  }
  function insights(st) {
    const out = [];
    const unpaid = Object.entries(st.byCur).filter(([, c]) => c.unpaid > 0);
    if (unpaid.length) out.push({ kind: 'unpaid', text: `${unpaid.map(([cur, c]) => money(c.unpaid, cur, true)).join(' · ')} עדיין לא סומנו כשולמו` });
    if (st.pending) out.push({ kind: 'pending', text: pl(st.pending, 'משמרת אחת ממתינה לתעריף', '# משמרות ממתינות לתעריף') });
    if (st.prevMinutes > 0 && st.minutes > 0) {
      const ch = Math.round((st.minutes - st.prevMinutes) / st.prevMinutes * 100);
      if (Math.abs(ch) >= 5) out.push({ kind: 'trend', text: `${Math.abs(ch)}% ${ch > 0 ? 'יותר' : 'פחות'} שעות מ${MONTH[parseYmd(prevMonth(st.k) + '-01').getMonth()]}` });
    }
    const top = st.days.indexOf(Math.max(...st.days));
    if (st.minutes > 0) out.push({ kind: 'day', text: `יום ${DAY[top]} הוא היום העמוס שלך` });
    return out.slice(0, 3);
  }
  function wrapped(k) {
    const st = monthStats(k);
    const longest = st.list.reduce((a, s) => (!a || shiftMinutes(s) > shiftMinutes(a) ? s : a), null);
    const topCat = Object.entries(st.cats).sort((a, b) => b[1] - a[1])[0];
    const nights = st.list.filter(s => span(s.start, s.end).overnight || toMin(s.end) >= 23 * 60).length;
    const bestDay = st.days.indexOf(Math.max(...st.days));
    return { st, longest, topCat: topCat ? { name: cat(topCat[0]).name, minutes: topCat[1] } : null, nights, bestDay: DAY[bestDay] };
  }

  /* ---------- shared UI helpers ---------- */
  function toast(msg, action, fn, ms = 5200) {
    let host = document.getElementById('core-toast');
    if (!host) { host = document.createElement('div'); host.id = 'core-toast'; host.setAttribute('role', 'status'); document.body.append(host); }

  if (d) {
    if (t.id === 'dt' && t.value) { d.date = t.value; drawAdd(); return; }
    if (t.id === 'until') { d.repeat.until = t.value; drawAdd(); return; }
    if (t.id === 'grp') { d.group = t.checked ? { workers: [] } : null; drawAdd(); return; }
    if (t.id === 'rep') { d.repeat = t.checked ? { days: [C.weekday(d.date)], until: C.addDays(d.date, 56) } : null; drawAdd(); return; }
    if (t.id === 'cur') { d.currency = t.value; drawAdd(); return; }
    if (t.dataset.wb) { d.group.workers[t.dataset.wb].on = t.checked; return; }
    if (t.id === 'brk') { d.breakMin = t.value; drawAdd(); return; }
  }
  const s = S().settings;
  if (t.id === 'auto') { s.autoConfirm = t.checked; C.commit(); if (t.checked) { const x = C.catchUp(); C.commit(); if (x.length) C.toast(C.pl(x.length, 'משמרת אחת נרשמה', '# משמרות נרשמו'), 'ביטול', () => C.undoAuto(x)); } }
  if (t.id === 'nmo') { s.notifyMonthly = t.checked; C.commit(); }
  if (t.id === 'nr') { s.notifyRate = t.checked; C.commit(); }
  if (t.id === 'defcat') { s.defaultCat = t.value; C.commit(); }
});
document.addEventListener('input', e => { const t = e.target; if (!d) return; if (t.id === 'nt') d.notes = t.value; if (t.dataset.wv) d.group.workers[t.dataset.wv].bonus = Number(t.value) || 0; });
document.addEventListener('keydown', e => {
  if (d && $('.add-page') && !/INPUT|SELECT/.test(document.activeElement.tagName)) {
    if (/^[0-9]$/.test(e.key)) { key(e.key); e.preventDefault(); } else if (e.key === 'Backspace') { key('⌫'); e.preventDefault(); } else if (e.key === 'Enter') { $('.keys .save:not([disabled])')?.click(); }
  }
  if (e.key === 'Escape') { if ($('#layer').innerHTML) closeSheet(); else if (d) closeAdd(); document.querySelector('.over,.brandp')?.remove(); }
});
C.longPress(document.body, '.card[data-id]', el => { sel.add(el.dataset.id); render(); });
setInterval(() => { const el = $('#tick'); if (el && timer) { const s = Math.floor((Date.now() - timer.at) / 1000); el.textContent = `${Math.floor(s / 3600)}:${C.pad(Math.floor(s / 60) % 60)}:${C.pad(s % 60)}`; } }, 1000);
C.subscribe(() => { if (!d) render(); });
C.mountPanel({ name: 'כיוון ב׳ · כיס', onBrand: brand, onWrapped: () => { month = C.ym(C.today()); wrapped(); } });
render();
const auto = C.catchUp(); if (auto.length) { C.commit(); C.toast(C.pl(auto.length, 'משמרת קבועה הסתיימה ונרשמה', '# משמרות קבועות הסתיימו ונרשמו'), 'ביטול', () => C.undoAuto(auto)); }
})();
</script>
