<title>חישוב שכר · יומן</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;500;600;700&display=swap">
<style>
/* Layout: a week of days drawn as vertical time columns above a day agenda; entries are written as sentences. Dark-first, evening palette. */
:root{
  --bg:#0E1412; --surface:#161F1C; --sunk:#1E2925; --ink:#E9EFEA; --muted:#93A49B; --line:#283430;
  --accent:#F1A45E; --on-accent:#1A1107; --accent-soft:#3A2A1A; --warn:#F2958B; --warn-soft:#3A1E1C;
  --font-body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  --font-display:"Frank Ruhl Libre","David",Georgia,serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F1F3EF; --surface:#FFFFFF; --sunk:#E5EAE5; --ink:#14201B; --muted:#5A6A62; --line:#D2DAD4;
  --accent:#A9500F; --on-accent:#FFFFFF; --accent-soft:#F8E4D2; --warn:#B0313F; --warn-soft:#FBE3E3; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F1F3EF; --surface:#FFFFFF; --sunk:#E5EAE5; --ink:#14201B; --muted:#5A6A62; --line:#D2DAD4;
  --accent:#A9500F; --on-accent:#FFFFFF; --accent-soft:#F8E4D2; --warn:#B0313F; --warn-soft:#FBE3E3; color-scheme:light}
/* Shared prototype chrome: toast + test panel. Uses each direction's tokens. */
#core-toast{position:fixed;inset-inline:0;margin-inline:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100% - 32px);display:flex;gap:16px;align-items:center;padding:12px 16px;border-radius:var(--toast-radius,12px);background:var(--ink);color:var(--bg);font:500 14px/1.4 var(--font-body);box-shadow:0 8px 30px rgb(0 0 0/.25);transform:translateY(16px);opacity:0;pointer-events:none;transition:transform .25s,opacity .25s;z-index:80}
#core-toast.show{transform:none;opacity:1;pointer-events:auto}
#core-toast button{background:none;border:0;color:inherit;font:700 14px var(--font-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
[hidden]{display:none!important}
#proto-fab{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom,0px));left:max(8px,env(safe-area-inset-left,0px));z-index:90;font:600 11px var(--font-body);letter-spacing:.02em;padding:6px 10px;border-radius:99px;border:1px dashed var(--muted);background:var(--bg);color:var(--muted);cursor:pointer;opacity:.85}
#proto-panel{position:fixed;bottom:calc(122px + env(safe-area-inset-bottom,0px));max-height:calc(100% - 140px);overflow:auto;left:max(8px,env(safe-area-inset-left,0px));z-index:91;width:min(320px,calc(100% - 16px));padding:14px;border-radius:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 18px 50px rgb(0 0 0/.25);font:14px/1.4 var(--font-body);display:grid;gap:8px}
#proto-panel .pp-head{display:flex;justify-content:space-between;align-items:center}
#proto-panel .pp-head button{background:none;border:0;color:var(--muted);font-size:16px;cursor:pointer}
#proto-panel .pp-note{margin:0;color:var(--muted);font-size:12px}
#proto-panel .pp-l{font-size:12px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}
#proto-panel .pp-clock{font-variant-numeric:tabular-nums;color:var(--ink)}
#proto-panel .pp-seg,#proto-panel .pp-actions{display:flex;gap:6px;flex-wrap:wrap}
#proto-panel .pp-seg button,#proto-panel .pp-actions button{flex:1;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 13px var(--font-body);cursor:pointer}
#proto-panel [aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body:has(.sheet.on) #proto-fab,body:has(.add-page) #proto-fab,body:has(.over) #proto-fab{display:none}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font-body);direction:rtl;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums lining-nums;unicode-bidi:isolate;direction:ltr;display:inline-block}
.serif{font-family:var(--font-display)}
.app{max-width:1060px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px}
.app>*{min-width:0}
header.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mast .word{display:flex;gap:10px;align-items:center;font-family:var(--font-display);font-weight:700;font-size:17px}
.mast .word svg{width:30px;height:30px}
.mast .mo{font-family:var(--font-display);font-weight:900;font-size:clamp(30px,8vw,44px);line-height:1}
.mast .mo small{font-size:.45em;font-weight:500;color:var(--muted);margin-inline-start:6px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);display:flex;gap:22px;padding-block:12px 0;margin-bottom:12px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
nav.tabs button{border:0;background:none;padding:6px 0 12px;font-weight:600;font-size:16px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-current=page]{color:var(--ink);border-bottom-color:var(--accent)}
.lede{font-family:var(--font-display);font-size:clamp(20px,5.2vw,26px);line-height:1.45;margin:6px 0 4px;text-wrap:pretty}
.lede b{font-weight:700;color:var(--accent)}
.lede .q{color:var(--warn);text-decoration:underline dotted;text-underline-offset:5px;cursor:pointer;background:none;border:0;font:inherit;padding:0}
/* Week */
.weekbar{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}
.weekbar strong{font-family:var(--font-display);font-size:18px}
.weekbar button{border:1px solid var(--line);background:var(--surface);border-radius:99px;min-width:40px;min-height:36px;cursor:pointer}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:0;background:var(--surface);border-radius:14px;padding:8px 0 6px;cursor:pointer;display:grid;justify-items:center;gap:6px;position:relative}
.day .dn{font-size:12px;color:var(--muted);font-weight:600}
.day .dd{font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1}
.day .col{position:relative;width:14px;height:96px;border-radius:7px;background:var(--sunk);overflow:hidden}
.day .col i{position:absolute;inset-inline:0;border-radius:4px;background:var(--accent)}
.day .col i.p{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent)}
.day .col i.w{background:var(--warn)}
.day .hrs{font-size:11px;color:var(--muted);min-height:16px}
.day[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.day[aria-pressed=true] .dn,.day[aria-pressed=true] .hrs{color:color-mix(in oklab,var(--bg) 70%,transparent)}
.day[aria-pressed=true] .col{background:color-mix(in oklab,var(--bg) 20%,transparent)}
.day.today .dd::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:3px auto 0}
/* Agenda */
.agenda-h{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 6px}
.agenda-h h2{font-family:var(--font-display);font-weight:700;font-size:24px;margin:0}
.agenda-h span{color:var(--muted);font-size:14px}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;align-items:baseline;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none}
.entry .tm{font-family:var(--font-display);font-weight:700;font-size:20px;grid-row:span 2;min-width:108px}
.entry .tm small{display:block;font-family:var(--font-body);font-weight:600;font-size:12px;color:var(--muted)}
.entry .wh{font-weight:600}
.entry .am{font-family:var(--font-display);font-weight:700;font-size:19px;grid-row:span 2}
.entry .sub{color:var(--muted);font-size:14px;min-width:0}
.entry.plan .tm,.entry.plan .am{color:var(--muted)}
.entry.plan .wh::after{content:" · מתוכנן";color:var(--accent);font-weight:600;font-size:13px}
.entry.await .wh::after{content:" · ממתין לאישורך";color:var(--warn)}
.entry.sel{background:var(--accent-soft);border-radius:12px;padding-inline:10px}
.q-amt{color:var(--warn);font-family:var(--font-body)!important;font-size:14px!important;font-weight:600!important}
.mark{white-space:nowrap;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 8px;margin-inline-start:6px;font-weight:600}
.e-acts{grid-column:1/-1;display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.e-acts button{min-height:40px;border-radius:99px;border:1px solid var(--line);background:none;padding-inline:16px;font-weight:600;cursor:pointer}
.e-acts .go{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.add-line{display:flex;align-items:center;gap:10px;width:100%;padding:16px 2px;border:0;border-bottom:1px dashed var(--line);background:none;color:var(--accent);font-weight:600;font-size:16px;cursor:pointer;text-align:start}
.add-line b{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--accent);display:grid;place-items:center;font-size:18px;line-height:1}
/* Sentence composer */
.compose{background:var(--surface);border-radius:20px;padding:18px 18px 14px;margin:10px 0 6px;box-shadow:0 0 0 1px var(--line),0 18px 40px rgb(0 0 0/.18);display:grid;gap:14px;animation:open .3s cubic-bezier(.2,.8,.2,1)}
.compose>*{min-width:0}
@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.sentence{font-family:var(--font-display);font-size:clamp(22px,5.8vw,28px);line-height:2.05;font-weight:500;margin:0}
.tok{display:inline-flex;align-items:center;gap:4px;position:relative;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:8px 8px 2px 2px;padding:0 8px;font:700 1em var(--font-display);line-height:1.35;cursor:pointer;vertical-align:baseline}
.tok.empty{color:var(--accent);border-bottom-style:dashed}
.tok.warn{background:var(--warn-soft);border-color:var(--warn)}
.tok input,.tok select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;font-size:16px}
.tok .chev{font-size:.5em;opacity:.6;font-family:var(--font-body)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:14px}
.meta .fig{font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--ink);margin-inline-start:auto}
.sugs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.sugs button,.adds button{min-height:38px;border-radius:99px;border:1px dashed var(--line);background:none;padding-inline:14px;font-weight:600;cursor:pointer;font-size:14px}
.sugs button{border-color:var(--accent);color:var(--accent)}
.adds{display:flex;gap:6px;flex-wrap:wrap}
.adds button[aria-pressed=true]{border-style:solid;border-color:var(--ink)}
.cbtn{display:flex;gap:8px}
.cbtn button{flex:1;min-height:50px;border-radius:14px;border:1px solid var(--line);background:none;font-weight:700;font-size:16px;cursor:pointer}
.cbtn .go{flex:2;background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.cbtn .go[disabled]{opacity:.4;cursor:not-allowed}
.note{font-size:14px;padding:8px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn)}
.extra{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.extra .r{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:grid;gap:4px}
.fld label{font-size:13px;color:var(--muted);font-weight:600}
.fld input,.fld select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding-inline:12px}
.ppl{display:grid;gap:6px}
.ppl .p{display:grid;grid-template-columns:auto 1fr 90px;gap:10px;align-items:center}
.ppl input[type=number]{min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding-inline:8px}
.ck{appearance:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);display:grid;place-items:center;cursor:pointer;margin:0}
.ck:checked{background:var(--accent);border-color:var(--accent)}
.ck:checked::after{content:"✓";color:var(--on-accent);font-size:14px;font-weight:700}
.wd{display:flex;gap:6px}
.wd button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:none;font-weight:700;cursor:pointer}
.wd button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:max(20px,env(safe-area-inset-left,0px));z-index:35;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 10px 26px rgb(0 0 0/.3)}
/* List view, month */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.seg button{border:0;background:none;min-height:34px;padding-inline:14px;border-radius:99px;font-weight:600;color:var(--muted);cursor:pointer;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:14px}
.cal .h{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding-bottom:4px}
.cal .c{aspect-ratio:1;max-width:100%;border-radius:10px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:15px;background:var(--sunk);position:relative;border:0;cursor:pointer;color:var(--ink)}
.cal .c.out{opacity:0;pointer-events:none}
.cal .c.td{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .c.pl{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
.cal .c.wq::after{content:"";position:absolute;top:6px;inset-inline-end:6px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-inline-end:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-top:1px solid var(--line);margin-top:20px}
.facts div{padding:14px 2px;border-bottom:1px solid var(--line)}
.facts small{color:var(--muted);font-size:13px;display:block}
.facts b{font-family:var(--font-display);font-size:26px;font-weight:700}
.read{min-height:54px;width:100%;border-radius:14px;border:0;background:var(--ink);color:var(--bg);font:700 17px var(--font-display);cursor:pointer;margin-top:22px}
/* Settings */
.sec-t{font-family:var(--font-display);font-weight:700;font-size:20px;margin:26px 0 4px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.opt .l{flex:1;min-width:0}
.opt .l small{display:block;color:var(--muted);font-size:14px}
.opt select{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding-inline:8px}
.what{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.explain{margin-top:10px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;gap:8px;font-size:15px}
.explain ol{margin:0;padding-inline-start:20px}
.explain a{color:var(--accent);font-weight:700}
.tg{appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:0 0 auto;margin-top:2px}
.tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:inset-inline-start .2s}
.tg:checked{background:var(--accent)}
.tg:checked::after{inset-inline-start:21px;background:var(--on-accent)}
.btn-s{min-height:40px;border-radius:99px;border:1px solid var(--line);background:none;padding-inline:16px;font-weight:600;cursor:pointer}
/* Bottom sheet for bulk + series */
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.5);z-index:60}
.sheet{position:fixed;inset:auto 0 0 0;z-index:61;background:var(--surface);border-radius:22px 22px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:85%;overflow:auto;animation:open .3s}
.sheet .in{max-width:600px;margin-inline:auto;display:grid;gap:12px}
.sheet .in>*{min-width:0}
.sheet h3{font-family:var(--font-display);font-size:24px;margin:0}
.selbar{position:fixed;inset:auto 0 0 0;z-index:45;background:var(--ink);color:var(--bg);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.selbar .in{max-width:1060px;margin-inline:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.selbar strong{margin-inline-end:auto;font-family:var(--font-display);font-size:18px}
.selbar button{min-height:40px;border-radius:99px;border:1px solid color-mix(in oklab,var(--bg) 35%,transparent);background:none;color:var(--bg);font-weight:600;padding-inline:14px;cursor:pointer}
/* Wrapped */
.over{position:fixed;inset:0;z-index:80;background:var(--bg);color:var(--ink);display:grid;grid-template-rows:auto 1fr auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.over .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:10px}
.page{align-self:center;max-width:600px;margin-inline:auto;width:100%;display:grid;gap:16px;animation:open .5s}
.page .kick{font-size:13px;letter-spacing:.08em;color:var(--accent);font-weight:700}
.page h3{font-family:var(--font-display);font-weight:900;font-size:clamp(34px,9vw,58px);line-height:1.08;margin:0;text-wrap:balance}
.page h3 em{font-style:normal;color:var(--accent)}
.page p{margin:0;font-size:18px;color:var(--muted);max-width:44ch}
.over .ctl{display:flex;justify-content:space-between;gap:8px;max-width:600px;margin-inline:auto;width:100%}
.over .ctl button{min-height:50px;border-radius:14px;border:1px solid var(--line);background:none;font-weight:700;padding-inline:18px;cursor:pointer}
.over .ctl .go{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.brandp{position:fixed;inset:0;z-index:80;overflow:auto;background:var(--bg);padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.brandp .in{max-width:820px;margin-inline:auto;display:grid;gap:22px}
.brandp .in>*{min-width:0}
.bph{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.bph svg{width:100px;height:100px}
.bph h1{font-family:var(--font-display);font-weight:900;font-size:clamp(38px,10vw,60px);margin:0;line-height:1}
.bph p{margin:6px 0 0;color:var(--muted);font-size:17px}
.homescr{border-radius:30px;padding:22px;background:linear-gradient(170deg,#24323A,#0B1013);display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px;max-width:340px}
.homescr div{display:grid;justify-items:center;gap:6px;font-size:11px;color:#fff}
.homescr .ic{width:56px;height:56px;border-radius:16px;background:rgb(255 255 255/.14)}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.sws div{border-radius:14px;padding:44px 12px 10px;font-weight:700;font-size:13px;border:1px solid var(--line)}
@media (min-width:900px){
  .two{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:start}
  .two>*{min-width:0}
  .fab{left:max(32px,calc(50% - 530px + 32px))}
}
</style>

<div class="app" id="app"></div>
<button class="fab" id="fab" aria-label="משמרת חדשה" data-act="add">+</button>
<div id="layer"></div>

<script>
/* Salary Calculation 2.0 prototypes: shared behaviour engine.
   Synthetic data only. Every direction renders its own UI on top of this. */
const Core = (() => {
  'use strict';
  const DAY = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
  const DAY_SHORT = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
  const MONTH = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];

  /* ---------- dates & times ---------- */
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
  const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const fromMin = m => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
  const weekday = s => parseYmd(s).getDay();
  const ym = s => s.slice(0, 7);

  let clockOffset = 0; // minutes; the prototype panel can move time forward
  const now = () => new Date(Date.now() + clockOffset * 60000);
  const today = () => ymd(now());
  const nowMin = () => { const n = now(); return n.getHours() * 60 + n.getMinutes(); };
  const roundedEnd = () => fromMin(Math.floor(nowMin() / 30) * 30);

  function dayLabel(s) {
    const t = today();
    if (s === t) return 'היום';
    if (s === addDays(t, -1)) return 'אתמול';
    if (s === addDays(t, 1)) return 'מחר';
    const d = parseYmd(s);
    return `יום ${DAY_SHORT[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}`;
  }
  const shortDate = s => { const d = parseYmd(s); return `${d.getDate()}.${d.getMonth() + 1}`; };
  const monthName = k => { const [y, m] = k.split('-').map(Number); return `${MONTH[m - 1]} ${y}`; };
  const prevMonth = k => { const [y, m] = k.split('-').map(Number); const d = new Date(y, m - 2, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
  const nextMonth = k => { const [y, m] = k.split('-').map(Number); const d = new Date(y, m, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };

  /* Shift span. End earlier than start means the shift crosses midnight. */
  function span(start, end, breakMin = 0) {
    if (!start || !end) return null;
    const s = toMin(start); let e = toMin(end);
    if (e === s) return { minutes: 0, overnight: false, invalid: true, reason: 'שעת ההתחלה והסיום זהות' };
    const overnight = e < s;
    if (overnight) e += 1440;
    const minutes = e - s - (Number(breakMin) || 0);
    if (minutes <= 0) return { minutes: 0, overnight, invalid: true, reason: 'ההפסקה ארוכה מהמשמרת' };
    return { minutes, overnight, invalid: false, long: minutes > 16 * 60 };
  }
  const endDateTime = (date, start, end) => {
    const d = parseYmd(date); const s = toMin(start); let e = toMin(end); if (e <= s) e += 1440;
    d.setMinutes(e); return d;
  };
  const startDateTime = (date, start) => { const d = parseYmd(date); d.setMinutes(toMin(start)); return d; };

  /* ---------- formatting ---------- */
  const nf = new Intl.NumberFormat('he-IL', { maximumFractionDigits: 2 });
  const nf0 = new Intl.NumberFormat('he-IL', { maximumFractionDigits: 0 });
  const money = (v, cur, whole) => cur + (whole ? nf0 : nf).format(v);
  const hours = mins => { const h = mins / 60; return (Math.round(h * 100) / 100).toLocaleString('he-IL', { maximumFractionDigits: 2 }); };
  const hm = mins => `${Math.floor(mins / 60)}:${pad(mins % 60)}`;
  const round2 = v => Math.round((v + Number.EPSILON) * 100) / 100;
  const pl = (n, one, many) => n === 1 ? one : many.replace('#', n);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- state ---------- */
  let KEY = 'salary-v2-proto';
  let state;
  const listeners = new Set();
  const uid = () => Math.random().toString(36).slice(2, 10);

  const CATS = [
    { id: 'c1', name: 'מסעדת הנמל', rate: 52, currency: '₪', hue: 0 },
    { id: 'c2', name: 'שיעורים פרטיים', rate: 120, currency: '₪', hue: 1 },
    { id: 'c3', name: 'פרילנס — עיצוב', rate: 35, currency: '$', hue: 2 },
    { id: 'c4', name: 'גן אירועים אלמוג', rate: null, currency: '₪', hue: 3 },
  ];
  const WORKERS = ['נועה', 'איתי', 'מאיה', 'עומר'];

  function seed() {
    const t = today();
    const shifts = [];
    const add = (offset, cat, start, end, extra = {}) => {
      const date = addDays(t, offset);
      const c = CATS.find(x => x.id === cat);
      const rate = 'rate' in extra ? extra.rate : c.rate;
      const sp = span(start, end, extra.breakMin || 0);
      const bonus = extra.bonus || 0;
      shifts.push({
        id: uid(), cat, date, start, end, breakMin: extra.breakMin || 0, rate, currency: c.currency, bonus,
        total: rate == null ? null : round2(sp.minutes / 60 * rate + bonus),
        paid: offset < -13, notes: extra.notes || '', group: extra.group || null, auto: false, ruleKey: null,
      });
    };
    // Six weeks of a realistic mixed pattern.
    for (let off = -44; off <= -1; off++) {
      const wd = weekday(addDays(t, off));
      if (wd === 0 || wd === 2) add(off, 'c1', '17:00', off % 3 === 0 ? '23:00' : '22:30');
      if (wd === 4 && off < -7) add(off, 'c1', '17:00', '22:30');
      if (wd === 1 || wd === 3) add(off, 'c2', '16:00', '18:00');
      if (wd === 5 && off % 2 === 0) add(off, 'c3', '09:00', '13:30', { breakMin: 30 });
    }
    // Details that show the new behaviour.
    add(-9, 'c1', '20:00', '02:00', { bonus: 50, notes: 'סגירה של אירוע פרטי' });
    add(-6, 'c4', '18:00', '01:00', { rate: null, notes: 'חתונה — התעריף עוד לא סוכם' });
    add(-2, 'c4', '19:00', '00:30', { rate: null });
    add(-12, 'c4', '17:30', '23:30', {
      rate: 45, bonus: 40,
      group: { workers: [{ name: 'נועה', bonus: 40 }, { name: 'איתי', bonus: 40 }, { name: 'מאיה', bonus: 0 }] },
      notes: 'הפקה עם צוות',
    });
    const rules = [{
      id: 'r1', cat: 'c1', days: [0, 2, 4], start: '17:00', end: '22:30', rate: 52, currency: '₪',
      from: t, until: addDays(t, 55),
    }, {
      id: 'r2', cat: 'c2', days: [1, 3], start: '16:00', end: '18:00', rate: 120, currency: '₪',
      from: addDays(t, 1), until: addDays(t, 40),
    }];
    return {
      v: 1, cats: CATS.map(c => ({ ...c })), workers: [...WORKERS], shifts, rules, exceptions: {},
      settings: {
        autoConfirm: true, notifyMonthly: true, notifyRate: true, rateFrequency: 'weekly',
        planningView: 'unified', defaultCat: 'c1', aiKey: false, theme: 'system',
      },
      lastAuto: [], clockOffset: 0,
    };
  }

  function load(direction) {
    KEY = 'salary-v2-proto-' + direction;
    try { state = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch { state = null; }
    if (!state || state.v !== 1) state = seed();
    clockOffset = state.clockOffset || 0;
    return state;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { /* storage may be blocked */ } }
  function commit() { save(); listeners.forEach(fn => fn(state)); }
  const subscribe = fn => listeners.add(fn);
  function reset() { state = seed(); clockOffset = 0; commit(); }
  function advance(minutes) { clockOffset += minutes; state.clockOffset = clockOffset; const done = catchUp(); commit(); return done; }

  const cat = id => state.cats.find(c => c.id === id) || state.cats[0];

  /* ---------- planned shifts ---------- */
  const occKey = (ruleId, date) => `${ruleId}@${date}`;
  function occurrences() {
    const out = [];
    const confirmed = new Set(state.shifts.filter(s => s.ruleKey).map(s => s.ruleKey));
    for (const r of state.rules) {
      for (let d = r.from; d <= r.until; d = addDays(d, 1)) {
        if (!r.days.includes(weekday(d))) continue;
        const key = occKey(r.id, d);
        if (confirmed.has(key)) continue;
        const ex = state.exceptions[key] || {};
        if (ex.cancelled) continue;
        const o = { key, ruleId: r.id, cat: r.cat, date: d, start: ex.start || r.start, end: ex.end || r.end,
          rate: 'rate' in ex ? ex.rate : r.rate, currency: r.currency, bonus: ex.bonus || 0, edited: !!ex.start || 'rate' in ex };
        o.status = endDateTime(o.date, o.start, o.end) <= now() ? 'awaiting' : 'planned';
        out.push(o);
      }
    }
    return out.sort((a, b) => startDateTime(a.date, a.start) - startDateTime(b.date, b.start));
  }
  function shiftFromOcc(o, auto) {
    const sp = span(o.start, o.end);
    return { id: uid(), cat: o.cat, date: o.date, start: o.start, end: o.end, breakMin: 0, rate: o.rate, currency: o.currency,
      bonus: o.bonus || 0, total: o.rate == null ? null : round2(sp.minutes / 60 * o.rate + (o.bonus || 0)),
      paid: false, notes: '', group: null, auto, ruleKey: o.key };
  }
  /* Safe catch-up: idempotent because each occurrence key can be confirmed once. */
  function catchUp() {
    if (!state.settings.autoConfirm) return [];
    const done = [];
    for (const o of occurrences()) if (o.status === 'awaiting' && !state.exceptions[o.key]?.hold) { const s = shiftFromOcc(o, true); state.shifts.push(s); done.push(s.id); }
    if (done.length) state.lastAuto = done;
    return done;
  }
  function undoAuto(ids) {
    // Undo turns them back into planned/awaiting occurrences; nothing else changes.
    for (const s of state.shifts) if (ids.includes(s.id) && s.ruleKey) state.exceptions[s.ruleKey] = { ...(state.exceptions[s.ruleKey] || {}), hold: true };
    state.shifts = state.shifts.filter(s => !ids.includes(s.id));
    commit();
  }
  function confirmOcc(key) { const o = occurrences().find(x => x.key === key); if (o) { state.shifts.push(shiftFromOcc(o, false)); commit(); } }
  function cancelOcc(key) { state.exceptions[key] = { ...(state.exceptions[key] || {}), cancelled: true }; commit(); }
  function restoreOcc(key) { const ex = state.exceptions[key]; if (ex) delete ex.cancelled; commit(); }
  function editOcc(key, patch, scope) {
    const [ruleId, date] = key.split('@');
    const r = state.rules.find(x => x.id === ruleId);
    if (scope === 'one') { state.exceptions[key] = { ...(state.exceptions[key] || {}), ...patch }; }
    else {
      // This and following: end the old series the day before, start a new one.
      const nr = { ...r, id: 'r' + uid(), from: date, ...patch };
      r.until = addDays(date, -1);
      state.rules.push(nr);
    }
    commit();
  }
  function futureCount(ruleId) { return occurrences().filter(o => o.ruleId === ruleId && o.status === 'planned').length; }
  function applyRateToFuture(ruleId, rate) {
    const r = state.rules.find(x => x.id === ruleId); r.rate = rate;
    for (const o of occurrences()) if (o.ruleId === ruleId && o.status === 'planned' && state.exceptions[o.key]) delete state.exceptions[o.key].rate;
    commit();
  }
  function previewRule(rule) {
    const dates = [];
    for (let d = rule.from; d <= rule.until; d = addDays(d, 1)) if (rule.days.includes(weekday(d))) dates.push(d);
    const occ = occurrences();
    const clashes = dates.filter(d => occ.some(o => o.date === d && overlaps(o, rule)) || state.shifts.some(s => s.date === d && overlaps(s, rule)));
    return { dates, clashes };
  }
  function overlaps(a, b) {
    const as = toMin(a.start), bs = toMin(b.start);
    let ae = toMin(a.end), be = toMin(b.end); if (ae <= as) ae += 1440; if (be <= bs) be += 1440;
    return as < be && bs < ae;
  }

  /* ---------- drafts (add / edit shift) ---------- */
  function suggestStart(catId, date) {
    const same = state.shifts.filter(s => s.cat === catId && weekday(s.date) === weekday(date));
    const mode = list => { const m = {}; list.forEach(s => m[s.start] = (m[s.start] || 0) + 1); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
    const strong = mode(same);
    const chips = mode(state.shifts.filter(s => s.cat === catId)).slice(0, 3).map(x => x[0]);
    const fallback = chips.length ? chips : mode(state.shifts).slice(0, 3).map(x => x[0]);
    return { start: strong.length && strong[0][1] >= 3 ? strong[0][0] : null, chips: fallback };
  }
  function newDraft(over = {}) {
    const c = cat(state.settings.defaultCat);
    const d = { id: null, cat: c.id, date: today(), start: null, end: roundedEnd(), breakMin: 0, rate: c.rate, rateUnknown: c.rate == null,
      currency: c.currency, bonus: 0, bonusTarget: 'me', notes: '', group: null, repeat: null, ...over };
    if (!over.start) d.start = suggestStart(d.cat, d.date).start;
    return d;
  }
  function draftFromShift(s) {
    return { id: s.id, cat: s.cat, date: s.date, start: s.start, end: s.end, breakMin: s.breakMin, rate: s.rate, rateUnknown: s.rate == null,
      currency: s.currency, bonus: s.bonus, bonusTarget: 'me', notes: s.notes, group: s.group ? JSON.parse(JSON.stringify(s.group)) : null, repeat: null, auto: s.auto };
  }
  function setDraftCat(d, id) {
    const c = cat(id); d.cat = id; d.currency = c.currency;
    if (!d.id) { d.rate = c.rate; d.rateUnknown = c.rate == null; const s = suggestStart(id, d.date); if (s.start) d.start = s.start; }
  }
  function evaluate(d) {
    const errors = [], warnings = [];
    if (!d.start) errors.push('בחר שעת התחלה');
    const sp = d.start ? span(d.start, d.end, d.breakMin) : null;
    if (sp && sp.invalid) errors.push(sp.reason);
    if (sp && sp.long) warnings.push('משמרת של יותר מ-16 שעות. לוודא?');
    if (sp && sp.overnight && toMin(d.end) > toMin(d.start) - 60 && sp.minutes > 20 * 60) warnings.push('נראה כמו טעות בשעות');
    const rate = d.rateUnknown ? null : Number(d.rate);
    if (!d.rateUnknown && !(rate >= 0)) errors.push('הזן תעריף, או סמן "תעריף חסר"');
    const myBonus = d.group ? (d.bonusTarget === 'others' ? 0 : Number(d.bonus) || 0) : Number(d.bonus) || 0;
    const base = sp && !sp.invalid && rate != null ? sp.minutes / 60 * rate : null;
    return { errors, warnings, span: sp, base, bonus: myBonus, total: base == null ? null : round2(base + myBonus) };
  }
  function saveDraft(d) {
    const ev = evaluate(d);
    if (ev.errors.length) return { ok: false, errors: ev.errors };
    if (d.repeat) {
      const r = { id: 'r' + uid(), cat: d.cat, days: d.repeat.days, start: d.start, end: d.end, rate: d.rateUnknown ? null : Number(d.rate),
        currency: d.currency, from: d.date, until: d.repeat.until };
      state.rules.push(r); const done = catchUp(); commit();
      return { ok: true, rule: r, auto: done };
    }
    const rec = { cat: d.cat, date: d.date, start: d.start, end: d.end, breakMin: Number(d.breakMin) || 0, rate: d.rateUnknown ? null : Number(d.rate),
      currency: d.currency, bonus: ev.bonus, total: ev.total, notes: d.notes, group: d.group };
    if (d.id) { const s = state.shifts.find(x => x.id === d.id); Object.assign(s, rec, { auto: false }); }
    else state.shifts.push({ id: uid(), paid: false, auto: false, ruleKey: null, ...rec });
    commit(); return { ok: true };
  }
  function deleteShift(id) { const i = state.shifts.findIndex(s => s.id === id); const [s] = state.shifts.splice(i, 1); commit(); return s; }
  function restoreShift(s) { state.shifts.push(s); commit(); }

  /* Bulk rate completion: writes only to shifts whose rate is missing. */
  function bulkRatePreview(ids, rate) {
    const list = state.shifts.filter(s => ids.includes(s.id));
    const target = list.filter(s => s.rate == null);
    return { target: target.map(s => ({ ...s, newTotal: round2(span(s.start, s.end, s.breakMin).minutes / 60 * rate + (s.bonus || 0)) })), skipped: list.length - target.length };
  }
  function bulkRateApply(ids, rate) {
    const done = [];
    for (const s of state.shifts) if (ids.includes(s.id) && s.rate == null) {
      s.rate = rate; s.total = round2(span(s.start, s.end, s.breakMin).minutes / 60 * rate + (s.bonus || 0)); done.push(s.id);
    }
    commit(); return done;
  }
  function setPaid(ids, paid) { state.shifts.forEach(s => { if (ids.includes(s.id)) s.paid = paid; }); commit(); }

  /* ---------- summaries ---------- */
  const shiftMinutes = s => span(s.start, s.end, s.breakMin).minutes;
  function monthStats(k) {
    const list = state.shifts.filter(s => ym(s.date) === k);
    const byCur = {};
    let minutes = 0, pending = 0;
    for (const s of list) {
      const m = shiftMinutes(s); minutes += m;
      if (s.total == null) { pending++; continue; }
      const c = byCur[s.currency] ||= { total: 0, paid: 0, unpaid: 0, minutes: 0 };
      c.total += s.total; c.minutes += m; s.paid ? c.paid += s.total : c.unpaid += s.total;
    }
    // Compare like with like: for the running month, only the same days of last month.
    const cutoff = k === ym(today()) ? Number(today().slice(8)) : 31;
    const prev = state.shifts.filter(s => ym(s.date) === prevMonth(k) && Number(s.date.slice(8)) <= cutoff).reduce((a, s) => a + shiftMinutes(s), 0);
    const days = Array(7).fill(0); list.forEach(s => days[weekday(s.date)] += shiftMinutes(s));
    const cats = {}; list.forEach(s => cats[s.cat] = (cats[s.cat] || 0) + shiftMinutes(s));
    const planned = occurrences().filter(o => ym(o.date) === k && o.status === 'planned');
    const plannedMin = planned.reduce((a, o) => a + span(o.start, o.end).minutes, 0);
    return { k, list, count: list.length, minutes, byCur, pending, prevMinutes: prev, days, cats, planned: planned.length, plannedMin };
  }
  function insights(st) {
    const out = [];
    const unpaid = Object.entries(st.byCur).filter(([, c]) => c.unpaid > 0);
    if (unpaid.length) out.push({ kind: 'unpaid', text: `${unpaid.map(([cur, c]) => money(c.unpaid, cur, true)).join(' · ')} עדיין לא סומנו כשולמו` });
    if (st.pending) out.push({ kind: 'pending', text: pl(st.pending, 'משמרת אחת ממתינה לתעריף', '# משמרות ממתינות לתעריף') });
    if (st.prevMinutes > 0 && st.minutes > 0) {
      const ch = Math.round((st.minutes - st.prevMinutes) / st.prevMinutes * 100);
      if (Math.abs(ch) >= 5) out.push({ kind: 'trend', text: `${Math.abs(ch)}% ${ch > 0 ? 'יותר' : 'פחות'} שעות מ${MONTH[parseYmd(prevMonth(st.k) + '-01').getMonth()]}` });
    }
    const top = st.days.indexOf(Math.max(...st.days));
    if (st.minutes > 0) out.push({ kind: 'day', text: `יום ${DAY[top]} הוא היום העמוס שלך` });
    return out.slice(0, 3);
  }
  function wrapped(k) {
    const st = monthStats(k);
    const longest = st.list.reduce((a, s) => (!a || shiftMinutes(s) > shiftMinutes(a) ? s : a), null);
    const topCat = Object.entries(st.cats).sort((a, b) => b[1] - a[1])[0];
    const nights = st.list.filter(s => span(s.start, s.end).overnight || toMin(s.end) >= 23 * 60).length;
    const bestDay = st.days.indexOf(Math.max(...st.days));
    return { st, longest, topCat: topCat ? { name: cat(topCat[0]).name, minutes: topCat[1] } : null, nights, bestDay: DAY[bestDay] };
  }

  /* ---------- shared UI helpers ---------- */
  function toast(msg, action, fn, ms = 5200) {
    let host = document.getElementById('core-toast');
    if (!host) { host = document.createElement('div'); host.id = 'core-toast'; host.setAttribute('role', 'status'); document.body.append(host); }
    host.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button">${esc(action)}</button>` : ''}`;
    host.className = 'show';
    if (action) host.querySelector('button').onclick = () => { host.className = ''; fn(); };
    clearTimeout(host._t); host._t = setTimeout(() => host.className = '', ms);
  }
  function setTheme(t) {
    state.settings.theme = t; commit();
    if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  }
  function applyTheme() { const t = state.settings.theme; if (t && t !== 'system') document.documentElement.setAttribute('data-theme', t); }

  /* Prototype control panel: not part of the product design. */
  function mountPanel({ name, onBrand, onWrapped }) {
    const b = document.createElement('button');
    b.type = 'button'; b.id = 'proto-fab'; b.textContent = 'אב-טיפוס'; b.setAttribute('aria-haspopup', 'dialog');
    const p = document.createElement('div'); p.id = 'proto-panel'; p.hidden = true; p.setAttribute('role', 'dialog'); p.setAttribute('aria-label', 'הגדרות אב-טיפוס');
    const draw = () => {
      const s = state.settings;
      const seg = (key, opts) => `<div class="pp-seg">${opts.map(([v, l]) => `<button type="button" data-k="${key}" data-v="${v}" aria-pressed="${s[key] === v}">${l}</button>`).join('')}</div>`;
      p.innerHTML = `<div class="pp-head"><strong>${esc(name)}</strong><button type="button" data-close aria-label="סגירה">✕</button></div>
        <p class="pp-note">לוח בדיקה בלבד. הנתונים בדויים ונשמרים רק בדפדפן הזה.</p>

}
function render() {
  const sep = S().settings.planningView === 'separate';
  if (view === 'plan' && !sep) view = 'journal';
  const tabs = [['journal', 'יומן'], ...(sep ? [['plan', 'תכנון']] : []), ['month', 'החודש'], ['set', 'הגדרות']];
  $('#app').innerHTML = `<header class="mast"><div class="word">${LOGO}<span>חישוב שכר</span></div><div class="mo">${E(C.MONTH[C.now().getMonth()])}<small class="num">${C.now().getFullYear()}</small></div></header>
    <nav class="tabs" aria-label="ניווט ראשי">${tabs.map(([k, l]) => `<button data-go="${k}" ${view === k ? 'aria-current="page"' : ''}>${l}</button>`).join('')}</nav>
    ${view === 'journal' ? (listMode ? list() : journal()) : view === 'month' ? monthView() : view === 'plan' ? plan() : settings()}`;
  $('#fab').hidden = view === 'set' || !!draft || sel.size > 0;

}
function selbar() {
  let b = $('#selbar');
  if (!sel.size) { b?.remove(); return; }

}
function sheet(html, mount) { $('#layer').innerHTML = `<div class="scrim" data-act="cs"></div><div class="sheet" role="dialog" aria-modal="true"><div class="in">${html}</div></div>`; mount?.(); }
function bulk() {

      <div class="fld"><label for="br">תעריף לשעה</label><input id="br" type="number" inputmode="decimal" value="${r || ''}"></div>
      ${p ? p.target.map(s => `<div class="entry" style="cursor:default"><span class="tm num">${s.start}–${s.end}<small>${E(C.dayLabel(s.date))}</small></span><span class="wh">${E(C.cat(s.cat).name)}</span><span class="am">${money(s.newTotal, s.currency)}</span></div>`).join('') + (p.skipped ? `<div class="note">${p.skipped} כבר עם תעריף ולא ישתנו</div>` : '') : ''}

      const i = $('#br'); i.focus(); i.oninput = () => { clearTimeout(i._t); i._t = setTimeout(() => draw(Number(i.value)), 350); };
      $('#bok').onclick = () => { const n = C.bulkRateApply(ids, r).length; sel.clear(); $('#layer').innerHTML = ''; C.toast(C.pl(n, 'רישום אחד עודכן', '# רישומים עודכנו')); };

}
function occEdit(key) {

    <div class="cbtn"><button id="o2">מהיום והלאה</button><button class="go" id="o1">רק הפעם</button></div>`, () => {
    const go = sc => { C.editOcc(key, { start: $('#os').value, end: $('#oe').value }, sc); $('#layer').innerHTML = ''; openOcc = null; C.toast(sc === 'one' ? 'שונה רק הפעם' : 'שונה מהיום והלאה'); };

}
function ruleRate(id) {
  const r = S().rules.find(x => x.id === id), n = C.futureCount(id);
  sheet(`<h3>תעריף למשמרת הקבועה</h3><p style="margin:0;color:var(--muted)">יחול על ${n} המשמרות הבאות בלוח. רישומים קיימים לא משתנים.</p><div class="fld"><label for="rr">לשעה (${E(r.currency)})</label><input id="rr" type="number" inputmode="decimal" value="${r.rate ?? ''}"></div><div class="cbtn"><button data-act="cs">ביטול</button><button class="go" id="rok">החלה</button></div>`,
    () => $('#rok').onclick = () => { C.applyRateToFuture(id, Number($('#rr').value)); $('#layer').innerHTML = ''; C.toast('התעריף עודכן'); });
}
function wrapped() {
  const w = C.wrapped(month), st = w.st, cur = Object.entries(st.byCur), mo = C.MONTH[Number(month.slice(5)) - 1];
  let hide = true, i = 0;
  const pages = [
    () => `<div class="kick">${E(C.monthName(month))}</div><h3>בחודש ${E(mo)} עבדת <em class="num">${C.hours(st.minutes)}</em> שעות.</h3><p>${st.count} משמרות, ${Object.keys(st.cats).length} מקומות עבודה.</p>`,
    () => w.topCat ? `<div class="kick">הבית השני</div><h3>רוב הזמן היית ב<em>${E(w.topCat.name)}</em>.</h3><p><span class="num">${C.hours(w.topCat.minutes)}</span> שעות, ${Math.round(w.topCat.minutes / Math.max(1, st.minutes) * 100)} אחוז מהחודש.</p>` : '<h3>חודש שקט.</h3>',
    () => w.longest ? `<div class="kick">הערב הארוך</div><h3>המשמרת הארוכה הייתה <em>${E(C.dayLabel(w.longest.date))}</em>, <span class="num">${w.longest.start}–${w.longest.end}</span>.</h3><p>${w.nights} פעמים סיימת אחרי אחת עשרה בלילה.</p>` : '',
    () => `<div class="kick">הקצב</div><h3>יום ${E(w.bestDay)} היה היום שלך.</h3><p>בו עבדת יותר מבכל יום אחר בשבוע.</p>`,
    () => `<div class="kick">השורה התחתונה</div><h3>${cur.map(([c, v]) => hide ? '<em>••••</em>' : `<em>${money(v.total, c)}</em>`).join(' ו-')}</h3><p>${st.pending ? `לא כולל ${C.pl(st.pending, 'משמרת אחת', '# משמרות')} שעוד בלי תעריף. ` : ''}הסכום מוסתר כשמשתפים.</p><button class="btn-s" data-rev style="justify-self:start">${hide ? 'הצגת הסכום' : 'הסתרה'}</button>`,
  ].filter(f => f());
  const el = document.createElement('div'); el.className = 'over'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'החודש שלך');
  const draw = () => { el.innerHTML = `<div class="top"><span>חישוב שכר · ${E(C.monthName(month))}</span><span class="num">${i + 1} / ${pages.length}</span></div><div class="page">${pages[i]()}</div>
    <div class="ctl"><button data-w="x">סגירה</button><span style="display:flex;gap:8px">${i ? '<button data-w="p">הקודם</button>' : ''}<button class="go" data-w="${i < pages.length - 1 ? 'n' : 's'}">${i < pages.length - 1 ? 'המשך' : 'שיתוף'}</button></span></div>`; };
  el.onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.rev !== undefined) { hide = !hide; draw(); return; }
    const a = b.dataset.w; if (a === 'x') return el.remove(); if (a === 'n') i++; if (a === 'p') i--; if (a === 's') return C.toast('בגרסה האמיתית: עמוד לשיתוף בלי סכומים'); draw(); };
  draw(); document.body.append(el);
}
function brand() {
  const el = document.createElement('div'); el.className = 'brandp'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'מיתוג');
  el.innerHTML = `<div class="in"><div style="display:flex;justify-content:space-between"><span class="mark" style="font-size:13px">כיוון ג׳ · יומן</span><button class="btn-s" data-x aria-label="סגירה">✕</button></div>
    <div class="bph">${LOGO}<div><h1>חישוב שכר</h1><p>יומן עבודה רגוע וכתוב, בצבעים של ערב.</p></div></div>
    <p class="lede" style="font-size:20px">הסמל הוא שמש על קו האופק: תחילת משמרת וסופה. הממשק בנוי כמו יומן: שבוע של ימים, ומתחתיו מה קרה בכל יום, במשפטים. רושמים משמרת כמו שאומרים אותה: "ביום חמישי עבדתי במסעדה מ-17 עד 22:30".</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;align-items:start">
      <div class="homescr">${'<div><span class="ic"></span><span>&nbsp;</span></div>'.repeat(6)}<div><span style="width:56px">${LOGO}</span><span>חישוב שכר</span></div><div><span class="ic"></span><span>&nbsp;</span></div></div>
      <div style="display:grid;gap:6px"><small style="color:var(--muted)">Frank Ruhl Libre · כותרות</small><span class="serif" style="font-size:40px;font-weight:900;line-height:1.1">ערב ארוך במסעדה</span><small style="color:var(--muted)">Assistant · טקסט</small><span style="font-size:19px">שולם · כולל בונוס ₪50</span></div>

/* ---------- events ---------- */
const reDraft = () => { const c = $('#compose'); if (!c) return render(); const tmp = document.createElement('div'); tmp.innerHTML = composer(); c.replaceWith(tmp.firstElementChild); };
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-occ],[data-id]'); if (!t) return;
  const ds = t.dataset;
  if (draft && t.closest('#compose')) {
    if (ds.st) { draft.start = ds.st; draft._touched = true; return reDraft(); }
    if (ds.wd) { const n = +ds.wd, a = draft.repeat.days; draft.repeat.days = a.includes(n) ? a.filter(x => x !== n) : [...a, n].sort(); return reDraft(); }
    if (ds.aw) { draft.group.workers.push({ name: ds.aw, bonus: 0 }); return reDraft(); }
    if (ds.bt) { draft.bonusTarget = ds.bt; draft.group.workers.forEach(w => { w.on = ds.bt !== 'me'; w.bonus = ds.bt === 'me' ? 0 : Number(draft.bonus) || 0; }); return reDraft(); }
  }
  if (ds.go) { view = ds.go; listMode = false; draft = null; sel.clear(); openOcc = null; render(); scrollTo(0, 0); return; }
  if (ds.day) { day = ds.day; if (draft && !draft.id) { draft.date = day; } render(); return; }
  if (ds.jump) { day = ds.jump; weekStart = C.addDays(day, -C.weekday(day)); view = 'journal'; listMode = false; render(); scrollTo(0, 0); return; }
  if (ds.f) { filter = ds.f; render(); return; }
  if (ds.ex) { explain = explain === ds.ex ? null : ds.ex; render(); return; }
  if (ds.rr) return ruleRate(ds.rr);
  if (ds.occ && !ds.act) { openOcc = openOcc === ds.occ ? null : ds.occ; render(); return; }
  if (ds.id && !ds.act && !t.closest('#compose')) { if (sel.size) { sel.has(ds.id) ? sel.delete(ds.id) : sel.add(ds.id); render(); return; } draft = C.draftFromShift(S().shifts.find(s => s.id === ds.id)); extra = !!(draft.group || draft.breakMin || draft.notes); render(); return; }
  const A = {
    add: () => { if (view !== 'journal' || listMode) { view = 'journal'; listMode = false; } draft = C.newDraft({ date: day }); extra = false; render(); requestAnimationFrame(() => $('#compose')?.scrollIntoView({ block: 'center', behavior: 'smooth' })); },
    addrep: () => { draft = C.newDraft({ repeat: { days: [C.weekday(C.today())], until: C.addDays(C.today(), 56) } }); extra = true; render(); },
    cancel: () => { draft = null; render(); },
    save: () => { const was = draft.id, r = C.saveDraft(draft); if (!r.ok) return; draft = null; render(); C.toast(r.rule ? `${C.previewRule(r.rule).dates.length} משמרות נוספו ללוח` : was ? 'הרישום עודכן' : 'נרשם'); },
    del: () => { const s = C.deleteShift(draft.id); draft = null; render(); C.toast('הרישום נמחק', 'ביטול', () => C.restoreShift(s)); },
    ru: () => { draft.rateUnknown = true; reDraft(); }, rk: () => { draft.rateUnknown = false; draft.rate = draft.rate ?? C.cat(draft.cat).rate ?? ''; reDraft(); },
    bon: () => { draft.bonus = 50; reDraft(); requestAnimationFrame(() => $('#cb')?.focus()); },
    ext: () => { extra = !extra; reDraft(); },
    pw: () => { weekStart = C.addDays(weekStart, -7); day = weekStart; render(); }, nw: () => { weekStart = C.addDays(weekStart, 7); day = weekStart; render(); },
    pm: () => { month = C.prevMonth(month); render(); }, nm: () => { month = C.nextMonth(month); render(); },
    list: () => { listMode = !listMode; draft = null; render(); scrollTo(0, 0); },
    pending: () => { view = 'journal'; listMode = true; filter = 'done'; sel = new Set(S().shifts.filter(s => s.rate == null).map(s => s.id)); render(); },
    start: () => { timer = { start: C.fromMin(C.nowMin()), at: Date.now() }; render(); },
    stop: () => { const st = timer.start; timer = null; draft = C.newDraft({ start: st, end: C.fromMin(C.nowMin()) }); render(); },
    ok: () => { C.confirmOcc(openOcc); openOcc = null; C.toast('נרשם'); }, no: () => { const k = openOcc; C.cancelOcc(k); openOcc = null; C.toast('בוטלה', 'ביטול', () => C.restoreOcc(k)); },
    eo: () => occEdit(openOcc), bulk, paid: () => { C.setPaid([...sel], true); C.toast(C.pl(sel.size, 'סומן כשולם', '# סומנו כשולמו')); sel.clear(); render(); }, unsel: () => { sel.clear(); render(); },
    cs: () => { $('#layer').innerHTML = ''; }, wr: () => wrapped(), ai: () => { S().settings.aiKey = !S().settings.aiKey; C.commit(); }, noop: () => C.toast('לא פעיל באב-טיפוס'),
  };
  A[ds.act]?.();
});
document.addEventListener('change', e => {
  const t = e.target, s = S().settings;
  if (draft) {
    if (t.id === 'cd' && t.value) { draft.date = t.value; day = t.value; weekStart = C.addDays(day, -C.weekday(day)); if (!draft.id && !draft._touched) { const g = C.suggestStart(draft.cat, draft.date); if (g.start) draft.start = g.start; } return render(); }
    if (t.id === 'cc') { C.setDraftCat(draft, t.value); return reDraft(); }
    if (t.id === 'cs' && t.value) { draft.start = t.value; draft._touched = true; return reDraft(); }
    if (t.id === 'ce' && t.value) { draft.end = t.value; return reDraft(); }
    if (t.id === 'cr') { draft.rate = t.value; return reDraft(); }
    if (t.id === 'cb') { draft.bonus = t.value; return reDraft(); }
    if (t.id === 'xb') { draft.breakMin = t.value; return reDraft(); }
    if (t.id === 'xc') { draft.currency = t.value; return reDraft(); }
    if (t.id === 'xg') { draft.group = t.checked ? { workers: [] } : null; return reDraft(); }
    if (t.id === 'xr') { draft.repeat = t.checked ? { days: [C.weekday(draft.date)], until: C.addDays(draft.date, 56) } : null; return reDraft(); }
    if (t.id === 'xf' && t.value) { draft.date = t.value; return reDraft(); }
    if (t.id === 'xu') { draft.repeat.until = t.value; return reDraft(); }
    if (t.dataset.wb) { draft.group.workers[t.dataset.wb].on = t.checked; return; }
  }
  if (t.id === 'sa') { s.autoConfirm = t.checked; C.commit(); if (t.checked) { const x = C.catchUp(); C.commit(); if (x.length) C.toast(C.pl(x.length, 'משמרת אחת נרשמה', '# משמרות נרשמו'), 'ביטול', () => C.undoAuto(x)); } }
  if (t.id === 'sm') { s.notifyMonthly = t.checked; C.commit(); }
  if (t.id === 'sr') { s.notifyRate = t.checked; C.commit(); }
  if (t.id === 'sf') { s.rateFrequency = t.value; C.commit(); }
  if (t.id === 'sd') { s.defaultCat = t.value; C.commit(); }
});
document.addEventListener('input', e => { const t = e.target; if (!draft) return; if (t.id === 'xn') draft.notes = t.value; if (t.dataset.wv) draft.group.workers[t.dataset.wv].bonus = Number(t.value) || 0; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#layer').innerHTML) $('#layer').innerHTML = ''; else if (draft) { draft = null; render(); } document.querySelector('.over,.brandp')?.remove(); } });
C.longPress(document.body, '.entry[data-id]', el => { sel.add(el.dataset.id); render(); });
setInterval(() => { const el = $('#tick'); if (el && timer) { const s = Math.floor((Date.now() - timer.at) / 1000); el.textContent = `${Math.floor(s / 3600)}:${C.pad(Math.floor(s / 60) % 60)}:${C.pad(s % 60)}`; } }, 1000);
C.subscribe(() => { if (!draft) render(); });
C.mountPanel({ name: 'כיוון ג׳ · יומן', onBrand: brand, onWrapped: () => { month = C.ym(C.today()); wrapped(); } });
render();
const auto = C.catchUp(); if (auto.length) { C.commit(); C.toast(C.pl(auto.length, 'משמרת קבועה הסתיימה ונרשמה', '# משמרות קבועות הסתיימו ונרשמו'), 'ביטול', () => C.undoAuto(auto)); }
})();
