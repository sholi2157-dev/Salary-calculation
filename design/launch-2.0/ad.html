<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Rubik;src:url(file:///home/user/salary-web/web/fonts/rubik_regular.ttf);font-weight:400}
@font-face{font-family:Rubik;src:url(file:///home/user/salary-web/web/fonts/rubik_medium.ttf);font-weight:500}
@font-face{font-family:Rubik;src:url(file:///home/user/salary-web/web/fonts/rubik_semibold.ttf);font-weight:600}
@font-face{font-family:Rubik;src:url(file:///home/user/salary-web/web/fonts/rubik_bold.ttf);font-weight:700}
@font-face{font-family:Secular;src:url(file:///home/user/salary-web/web/fonts/secular_one.ttf)}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0B0D12}
.ad{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Rubik;color:#fff}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 92% 4%,rgba(124,103,255,.55),rgba(81,69,232,.18) 34%,transparent 62%),radial-gradient(circle at 0% 100%,rgba(214,51,108,.28),transparent 45%)}
.blob{position:absolute;border-radius:50%}
.top{position:absolute;top:64px;right:72px;left:72px;display:flex;align-items:center;gap:20px}
.logo{width:84px;height:84px;border-radius:25px;background:#0D1015;box-shadow:0 0 0 2px rgba(255,255,255,.08);display:grid;place-items:center}
.brand{font-size:34px;font-weight:600}
.pill{margin-inline-start:auto;font:600 28px Rubik;padding:12px 26px;border-radius:99px;background:linear-gradient(120deg,#5145E8,#7D3CF0);box-shadow:0 10px 30px rgba(81,69,232,.5)}
h1{position:absolute;top:190px;right:72px;font:400 120px/1.04 Secular;letter-spacing:-1px}
h1 span{display:block}
h1 .b{background:linear-gradient(100deg,#B48CFF,#8F87FF 45%,#FF6B9A);-webkit-background-clip:text;color:transparent}
.phones{position:absolute;top:478px;left:0;right:0;height:560px;-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
.phone{position:absolute;width:330px;border-radius:44px;padding:10px;background:#1B1F27;box-shadow:0 40px 80px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.06)}
.phone img{display:block;width:100%;border-radius:35px}
.p1{right:150px;top:20px;transform:rotate(4deg);z-index:2}
.p2{left:150px;top:70px;transform:rotate(-8deg);width:300px;z-index:1}
.chips{position:absolute;top:470px;left:72px;display:none}
.feat{position:absolute;top:1028px;right:72px;left:72px;display:flex;flex-wrap:wrap;gap:14px;justify-content:flex-start}
.feat span{font:500 27px Rubik;padding:14px 24px;border-radius:99px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12);display:flex;align-items:center;gap:12px}
.feat i{width:14px;height:14px;border-radius:50%;display:inline-block}
.bottom{position:absolute;bottom:64px;right:72px;left:72px;display:flex;align-items:center;justify-content:space-between;padding-top:30px;border-top:1.5px solid rgba(255,255,255,.12)}
.bottom b{font:600 32px Rubik}
.bottom small{display:block;font:400 25px Rubik;color:rgba(255,255,255,.7);margin-top:6px}
.url{font:500 24px Rubik;color:rgba(255,255,255,.75);direction:ltr}
</style></head><body><div class="ad">
<div class="glow"></div>
<div class="blob" style="width:420px;height:420px;left:-160px;top:430px;background:#5145E8;opacity:.22;filter:blur(30px)"></div>
<div class="blob" style="width:300px;height:300px;right:-110px;top:820px;background:#0E8059;opacity:.25;filter:blur(30px)"></div>
<div class="top">
  <div class="logo"><svg viewBox="0 0 64 64" width="72" height="72"><g stroke-width="7" stroke-linecap="round"><path d="M19 44V30" stroke="#7C8CFF"/><path d="M32 44V20" stroke="#FFC54D"/><path d="M45 44V25" stroke="#34C79A"/><path d="M19 44h26" stroke="#EDF0F5"/></g></svg></div>
  <div class="brand">שכר עבודות אישי</div>
  <div class="pill">גרסה 2.0</div>
</div>
<h1><span>עיצוב חדש.</span><span class="b">התחלה חדשה.</span></h1>
<div class="phones">
  <div class="phone p2"><img src="story-dark.png"></div>
  <div class="phone p1"><img src="home-dark.png"></div>
</div>
<div class="feat">
  <span><i style="background:#8F87FF"></i>משמרות קבועות שנרשמות לבד</span>
  <span><i style="background:#FF6B9A"></i>החודש שלך בכיס</span>
  <span><i style="background:#3DDC97"></i>תעריף? אפשר גם אחר כך</span>
  <span><i style="background:#FFC94D"></i>בונוס, קבלנות וקבוצה</span>
</div>
<div class="bottom">
  <div><b>העדכון כבר מחכה באפליקציה</b><small>כל המשמרות והסכומים שלך נשמרים</small></div>
  <div class="url">salary-calculation-eta.vercel.app</div>
</div>
</div></body></html>
