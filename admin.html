<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#EDF0F5">
  <title>ניהול · חישוב שכר</title>
  <link rel="stylesheet" href="web/kis/kis.css">
  <link rel="stylesheet" href="web/admin/admin.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2219%22 fill=%22%230D1015%22/%3E%3Cg stroke-width=%227%22 stroke-linecap=%22round%22%3E%3Cpath d=%22M19 44V30%22 stroke=%22%237C8CFF%22/%3E%3Cpath d=%22M32 44V20%22 stroke=%22%23FFC54D%22/%3E%3Cpath d=%22M45 44V25%22 stroke=%22%2334C79A%22/%3E%3Cpath d=%22M19 44h26%22 stroke=%22%23EDF0F5%22/%3E%3C/g%3E%3C/svg%3E">
</head>
<body>
<div class="kis-glow"></div>
<main class="kis-page" id="admin">
  <div class="title-row">
    <h1 class="page-title">ניהול</h1>
    <button class="link" id="refresh" hidden>רענון</button>
  </div>
  <p class="caption" id="stamp">טוען…</p>
  <section id="gate" class="card gate" hidden>
    <p class="label" id="gate-text">הדף הזה פרטי. צריך להתחבר עם חשבון Google של בעל האתר.</p>
    <button class="btn primary" id="signin">התחברות עם Google</button>
    <button class="link" id="signout" hidden>להתחבר עם חשבון אחר</button>
  </section>
  <div id="board" hidden>
    <div class="switcher">
      <div class="tabs" role="group" aria-label="מה להציג" id="tabs">
        <button data-tab="app" aria-pressed="true">אפליקציה</button><button data-tab="site">אתר</button>
      </div>
      <div class="seg" role="group" aria-label="תקופה" id="range">
        <button data-days="7">7 ימים</button><button data-days="14">14 יום</button><button data-days="30" aria-pressed="true">30 יום</button>
      </div>
    </div>
    <div id="pane-app"></div>
    <div id="pane-site" hidden></div>
  </div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="web/admin/admin.js"></script>
</body>
</html>
